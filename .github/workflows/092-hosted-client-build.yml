name: TuTop 0.9.2 hardened client candidate

on:
  push:
    branches: [feat/tutop-0.9.2-hardening]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tutop-092-hosted-client-build-${{ github.ref }}
  cancel-in-progress: true

env:
  TUTOP_FIREBASE_PROJECT_ID: tutop-beta-vicmdlb-1356585881
  TUTOP_ANDROID_PACKAGE_NAME: mx.tutop.app
  TUTOP_BETA_VERSION: 0.9.2-beta.0
  TUTOP_ANDROID_VERSION_CODE: 90200
  TUTOP_APK_PATH: TuTop-0.9.2-beta.0-physical-qa-staging.apk
  TUTOP_APK_SHA256_PATH: TuTop-0.9.2-beta.0-physical-qa-staging.apk.sha256
  TUTOP_VALIDATED_BASE_SHA: ad5fc4b77de2b954cf616f6909c5b6a978d4472a
  TUTOP_VALIDATED_BASE_RUN_ID: "34772848879"
  TUTOP_VALIDATED_BASE_ARTIFACT: TuTop-0.9.2-beta.0-physical-qa-staging-12
  VITE_TUTOP_V2_REVIEWS_LAZY_CUTOVER: "false"
  VITE_TUTOP_V2_WALLET_LAZY_CUTOVER: "false"
  VITE_TUTOP_V2_FAVORITES_VISIBLE_CUTOVER: "false"
  VITE_TUTOP_TOPI_REMOTE_ENABLED: "false"

jobs:
  candidate:
    name: Hardened Android 0.9.2 client candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Prove exact source and unchanged backend surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node -p "require('./package.json').version")" = "$TUTOP_BETA_VERSION"
          test "$(node -p "require('./package-lock.json').version")" = "$TUTOP_BETA_VERSION"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "$TUTOP_BETA_VERSION"
          node scripts/assert-client-only-diff-092.mjs "$TUTOP_VALIDATED_BASE_SHA" "$GITHUB_SHA"

      - name: Install exact dependencies
        run: npm ci

      - name: Full regression, policy, TypeScript and 0.9.2 device gates
        run: |
          npm run check
          npm run typecheck
          node scripts/device-ux-ai-092-contract-tests.mjs

      - name: Recover validated public Firebase client configuration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/base
          gh run download "$TUTOP_VALIDATED_BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$TUTOP_VALIDATED_BASE_ARTIFACT" --dir /tmp/base
          python3 - <<'PY'
          import json, re, zipfile, pathlib, os
          apk = pathlib.Path('/tmp/base/TuTop-0.9.2-beta.0-physical-qa-staging.apk')
          if not apk.is_file(): raise SystemExit('VALIDATED_BASE_APK_MISSING')
          project='tutop-beta-vicmdlb-1356585881'; package='mx.tutop.app'
          with zipfile.ZipFile(apk) as z:
              js='\n'.join(z.read(n).decode('utf-8','ignore') for n in z.namelist() if n.startswith('assets/public/assets/') and n.endswith('.js'))
          raw=apk.read_bytes()
          def one(p,d,label):
              m=re.search(p,d)
              if not m: raise SystemExit('MISSING_VALIDATED_CLIENT_VALUE:'+label)
              v=m.group(1); return v.decode() if isinstance(v,bytes) else v
          web_key=one(r'VITE_FIREBASE_API_KEY:`([^`]+)`',js,'web_api_key')
          web_app=one(r'VITE_FIREBASE_APP_ID:`([^`]+)`',js,'web_app_id')
          android_app=one(rb'(1:900056291310:android:[0-9a-f]+)',raw,'android_app_id')
          android_key=one(rb'(AIza[0-9A-Za-z_-]{30,50})',raw,'android_api_key')
          storage=one(rb'(tutop-beta-vicmdlb-1356585881(?:\.firebasestorage\.app|\.appspot\.com))',raw,'storage_bucket')
          if project not in js: raise SystemExit('VALIDATED_PROJECT_MISMATCH')
          pathlib.Path('.tutop-staging-google-services.json').write_text(json.dumps({
            'project_info':{'project_number':'900056291310','project_id':project,'storage_bucket':storage},
            'client':[{'client_info':{'mobilesdk_app_id':android_app,'android_client_info':{'package_name':package}},'oauth_client':[],'api_key':[{'current_key':android_key}],'services':{'appinvite_service':{'other_platform_oauth_client':[]}}}],
            'configuration_version':'1'}))
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write(f'VITE_FIREBASE_API_KEY={web_key}\nVITE_FIREBASE_AUTH_DOMAIN={project}.firebaseapp.com\nVITE_FIREBASE_PROJECT_ID={project}\nVITE_FIREBASE_APP_ID={web_app}\n')
              env.write('VITE_TUTOP_SCHEMA_V2=true\nVITE_TUTOP_ENVIRONMENT=staging\nVITE_TUTOP_APP_VERSION=0.9.2-beta.0\n')
              # Play Integrity remains initialized and observable. The private
              # sideloaded 0.9.2 physical-QA client treats attestation as
              # best-effort because staging App Check is UNENFORCED; release/
              # production code may still require App Check.
              env.write('VITE_TUTOP_TOPI_FIREBASE_AI_ENABLED=true\nVITE_TUTOP_TOPI_MODEL=gemini-3.8-flash\nVITE_TUTOP_AI_APP_CHECK_REQUIRED=false\n')
          for value in (web_key,web_app,android_key,android_app): print('::add-mask::'+value)
          print('✅ Validated public Firebase client config recovered; privileged credentials were not copied.')
          PY

      - name: Build current web bundle
        run: npm run build

      - name: Install ephemeral native dependencies
        run: npm run deps:mobile

      - name: Keep package manifests immutable
        run: git diff --exit-code -- package.json package-lock.json

      - name: Generate hardened Android project
        env:
          TUTOP_ANDROID_GOOGLE_SERVICES_PATH: .tutop-staging-google-services.json
        run: |
          npm run android:bootstrap
          node scripts/configure-android-beta-version.mjs
          npm run android:doctor

      - name: Verify native privacy, permissions and AI attestation shape
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode 90200' android/app/build.gradle
          grep -q 'versionName "0.9.2-beta.0"' android/app/build.gradle
          grep -q 'ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
          ! grep -q 'ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          ! grep -q 'ACCESS_BACKGROUND_LOCATION' android/app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          ! grep -q 'READ_EXTERNAL_STORAGE' android/app/src/main/AndroidManifest.xml
          grep -q 'photopicker_activity:0:required' android/app/src/main/AndroidManifest.xml
          grep -q 'tools:ignore="MissingClass"' android/app/src/main/AndroidManifest.xml
          grep -q 'RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -q 'class TuTopVoicePlugin' android/app/src/main/java/mx/tutop/app/TuTopVoicePlugin.java
          grep -q 'class TuTopAIPlugin' android/app/src/main/java/mx/tutop/app/TuTopAIPlugin.java
          grep -q 'usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'firebase-appcheck-playintegrity' node_modules/@capacitor-firebase/app-check/android/build.gradle
          echo "✅ Android privacy/capability boundary + Play Integrity dependency verified."

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v6

      - name: Android lint, unit tests and APK assembly
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean lintDebug testDebugUnitTest assembleDebug

      - name: Stage APK and checksum
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk "$TUTOP_APK_PATH"
          HASH="$(sha256sum "$TUTOP_APK_PATH" | awk '{print $1}')"
          SIZE="$(wc -c < "$TUTOP_APK_PATH" | tr -d ' ')"
          printf '%s  %s\n' "$HASH" "$TUTOP_APK_PATH" > "$TUTOP_APK_SHA256_PATH"
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Write transparent QA provenance
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          pathlib.Path('CLIENT_QA_CANDIDATE_0.9.2.json').write_text(json.dumps({
            'schema':'tutop.client-physical-qa-candidate.v2',
            'app_version':'0.9.2-beta.0','source_sha':os.environ['GITHUB_SHA'],
            'validated_backend_base_sha':os.environ['TUTOP_VALIDATED_BASE_SHA'],
            'validated_backend_base_run_id':int(os.environ['TUTOP_VALIDATED_BASE_RUN_ID']),
            'backend_rules_changed_since_base':False,
            'evidence_inheritance_scope':'backend/rules only; current client/native code rebuilt and tested separately',
            'app_check_provider_android':'play-integrity',
            'firebase_ai_backend_previously_proven_with_app_check':True,
            'firebase_ai_physical_attestation_pending':True,
            'apk_sha256':pathlib.Path(os.environ['TUTOP_APK_SHA256_PATH']).read_text().split()[0],
            'physical_qa_candidate':True,'release_candidate':False,'production_ready':False,'play_ready':False
          },indent=2)+'\n')
          PY

      - name: Upload APK + provenance
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: TuTop-0.9.2-beta.0-hardened-client-${{ github.run_number }}
          path: |
            TuTop-0.9.2-beta.0-physical-qa-staging.apk
            TuTop-0.9.2-beta.0-physical-qa-staging.apk.sha256
            CLIENT_QA_CANDIDATE_0.9.2.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish private QA prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="tutop-0.9.2-beta.0-hardened-client-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "TuTop 0.9.2 beta.0 Hardened Client — build ${GITHUB_RUN_NUMBER}" \
            --notes "Private physical-QA client candidate. Current client/native SHA=${GITHUB_SHA}. Backend/rules unchanged from validated base ${TUTOP_VALIDATED_BASE_SHA} (run ${TUTOP_VALIDATED_BASE_RUN_ID}). Current client/native regression, TypeScript, Android lint/tests/build, permissions/privacy and Play Integrity shape passed. Firebase AI backend was previously proven with App Check; physical Play Integrity attestation remains observable but is not an enforcement gate for this sideloaded staging QA APK. Not production/Play-ready." \
            "$TUTOP_APK_PATH" "$TUTOP_APK_SHA256_PATH" CLIENT_QA_CANDIDATE_0.9.2.json

      - name: Remove recovered Firebase config
        if: always()
        run: rm -f .tutop-staging-google-services.json android/app/google-services.json
