name: TuTop 0.9.2 hosted rescue candidate

on:
  push:
    branches:
      - feat/tutop-0.9.2-hardening
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tutop-092-hosted-rescue-${{ github.ref }}
  cancel-in-progress: true

env:
  TUTOP_FIREBASE_PROJECT_ID: tutop-beta-vicmdlb-1356585881
  TUTOP_STAGING_WEB_CONFIG_PATH: .tutop-staging-web-config.json
  TUTOP_ANDROID_GOOGLE_SERVICES_PATH: .tutop-staging-google-services.json
  TUTOP_ANDROID_PACKAGE_NAME: mx.tutop.app
  TUTOP_BETA_VERSION: 0.9.2-beta.0
  TUTOP_ANDROID_VERSION_CODE: 90200
  TUTOP_APK_PATH: TuTop-0.9.2-beta.0-physical-qa-staging.apk
  TUTOP_APK_SHA256_PATH: TuTop-0.9.2-beta.0-physical-qa-staging.apk.sha256
  TUTOP_AI_APP_CHECK_REQUIRED: "false"
  VITE_TUTOP_TOPI_REMOTE_ENABLED: "false"
  VITE_TUTOP_V2_REVIEWS_LAZY_CUTOVER: "false"
  VITE_TUTOP_V2_WALLET_LAZY_CUTOVER: "false"
  VITE_TUTOP_V2_FAVORITES_VISIBLE_CUTOVER: "false"
  TUTOP_VALIDATED_BASE_SHA: ad5fc4b77de2b954cf616f6909c5b6a978d4472a
  TUTOP_VALIDATED_BASE_RUN_ID: "34772848879"
  TUTOP_VALIDATED_BASE_ARTIFACT: TuTop-0.9.2-beta.0-physical-qa-staging-12

jobs:
  hosted-client-candidate:
    name: Hosted client-only Physical QA candidate
    if: github.ref_name == 'feat/tutop-0.9.2-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact 0.9.2 SHA
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Require exact normalized source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/tutop-0.9.2-hardening"
          test "$(node -p "require('./package.json').version")" = "$TUTOP_BETA_VERSION"
          test "$(node -p "require('./package-lock.json').version")" = "$TUTOP_BETA_VERSION"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "$TUTOP_BETA_VERSION"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "${TUTOP_VALIDATED_BASE_SHA}^{commit}"

      - name: Prove backend and rules are unchanged since validated base
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${TUTOP_VALIDATED_BASE_SHA}...${GITHUB_SHA}" > /tmp/tutop-changed.txt
          cat /tmp/tutop-changed.txt
          BAD="$(grep -Ev '^(\.github/workflows/092-hosted-rescue\.yml|index\.html|scripts/(android-native-capabilities|android-topi-voice-plugin|check|device-ux-ai-092-contract-tests)\.mjs|src/components/AppearanceSettings\.tsx|src/services/(nativeDeviceCapabilities|nativeTopiAI)\.ts)$' /tmp/tutop-changed.txt || true)"
          if [ -n "$BAD" ]; then
            echo "DETENIDO: hosted rescue sólo puede heredar evidencia de backend cuando el diff desde la base validada es estrictamente cliente/nativo." >&2
            printf '%s\n' "$BAD" >&2
            exit 43
          fi
          echo "✅ Backend/rules unchanged from validated SHA ${TUTOP_VALIDATED_BASE_SHA}."

      - name: Install exact app dependencies
        run: npm ci

      - name: Full regression and policy suite
        run: npm run check

      - name: TypeScript and device hardening gates
        run: |
          npm run typecheck
          node scripts/device-ux-ai-092-contract-tests.mjs

      - name: Download last fully validated 0.9.2 APK client configuration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tutop-base
          gh run download "$TUTOP_VALIDATED_BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$TUTOP_VALIDATED_BASE_ARTIFACT" --dir /tmp/tutop-base
          test -s /tmp/tutop-base/TuTop-0.9.2-beta.0-physical-qa-staging.apk

      - name: Recover public Firebase client configuration from validated APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, zipfile, pathlib, os
          apk = pathlib.Path('/tmp/tutop-base/TuTop-0.9.2-beta.0-physical-qa-staging.apk')
          project = 'tutop-beta-vicmdlb-1356585881'
          package = 'mx.tutop.app'
          with zipfile.ZipFile(apk) as z:
              js = '\n'.join(
                  z.read(name).decode('utf-8', 'ignore')
                  for name in z.namelist()
                  if name.startswith('assets/public/assets/') and name.endswith('.js')
              )
          raw = apk.read_bytes()
          def one(pattern, data, label, flags=0):
              match = re.search(pattern, data, flags)
              if not match:
                  raise SystemExit(f'MISSING_VALIDATED_CLIENT_VALUE:{label}')
              value = match.group(1)
              return value.decode() if isinstance(value, bytes) else value
          web_key = one(r'VITE_FIREBASE_API_KEY:`([^`]+)`', js, 'web_api_key')
          web_app = one(r'VITE_FIREBASE_APP_ID:`([^`]+)`', js, 'web_app_id')
          android_app = one(rb'(1:900056291310:android:[0-9a-f]+)', raw, 'android_app_id')
          android_key = one(rb'(AIza[0-9A-Za-z_-]{30,50})', raw, 'android_api_key')
          storage = one(rb'(tutop-beta-vicmdlb-1356585881(?:\.firebasestorage\.app|\.appspot\.com))', raw, 'storage_bucket')
          if project not in js or ':web:' not in web_app or ':android:' not in android_app:
              raise SystemExit('VALIDATED_CLIENT_CONFIG_PROJECT_OR_APP_MISMATCH')
          web = {
              'apiKey': web_key,
              'authDomain': f'{project}.firebaseapp.com',
              'projectId': project,
              'appId': web_app,
          }
          android = {
              'project_info': {
                  'project_number': '900056291310',
                  'project_id': project,
                  'storage_bucket': storage,
              },
              'client': [{
                  'client_info': {
                      'mobilesdk_app_id': android_app,
                      'android_client_info': {'package_name': package},
                  },
                  'oauth_client': [],
                  'api_key': [{'current_key': android_key}],
                  'services': {'appinvite_service': {'other_platform_oauth_client': []}},
              }],
              'configuration_version': '1',
          }
          pathlib.Path('.tutop-staging-web-config.json').write_text(json.dumps(web), encoding='utf-8')
          pathlib.Path('.tutop-staging-google-services.json').write_text(json.dumps(android), encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'VITE_FIREBASE_API_KEY={web_key}\n')
              env.write(f'VITE_FIREBASE_AUTH_DOMAIN={project}.firebaseapp.com\n')
              env.write(f'VITE_FIREBASE_PROJECT_ID={project}\n')
              env.write(f'VITE_FIREBASE_APP_ID={web_app}\n')
              env.write('VITE_TUTOP_SCHEMA_V2=true\n')
              env.write('VITE_TUTOP_ENVIRONMENT=staging\n')
              env.write('VITE_TUTOP_APP_VERSION=0.9.2-beta.0\n')
              env.write('VITE_TUTOP_TOPI_FIREBASE_AI_ENABLED=true\n')
              env.write('VITE_TUTOP_TOPI_MODEL=gemini-3.8-flash\n')
              env.write('VITE_TUTOP_AI_APP_CHECK_REQUIRED=false\n')
          print(f'::add-mask::{web_key}')
          print(f'::add-mask::{android_key}')
          print(f'::add-mask::{web_app}')
          print(f'::add-mask::{android_app}')
          print('✅ Firebase public client config recovered from validated 0.9.2 APK without privileged credentials.')
          PY

      - name: Install Firebase client only for public-client AI proof
        run: npm install --no-save --package-lock=false --no-audit --no-fund firebase@12.18.0

      - name: Verify dependency manifests stayed immutable
        run: git diff --exit-code -- package.json package-lock.json

      - name: Prove Firebase AI from non-privileged client configuration
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { initializeApp, deleteApp } from 'firebase/app';
          import { getAI, getGenerativeModel, GoogleAIBackend, ThinkingLevel } from 'firebase/ai';
          const config = JSON.parse(fs.readFileSync('.tutop-staging-web-config.json', 'utf8'));
          const app = initializeApp(config, `tutop-hosted-client-ai-${Date.now()}`);
          try {
            const ai = getAI(app, { backend: new GoogleAIBackend() });
            const model = getGenerativeModel(ai, {
              model: 'gemini-3.8-flash',
              generationConfig: { temperature: 0, maxOutputTokens: 128, thinkingConfig: { thinkingLevel: ThinkingLevel.LOW } },
            });
            const request = model.generateContent('Health check TuTop 0.9.2. Responde solamente TUTOP_AI_CLIENT_OK_092.');
            const result = await Promise.race([
              request,
              new Promise((_, reject) => setTimeout(() => reject(new Error('CLIENT_AI_TIMEOUT')), 30000)),
            ]);
            const text = result?.response?.text?.() || '';
            if (!text.includes('TUTOP_AI_CLIENT_OK_092')) throw new Error('CLIENT_AI_MARKER_MISMATCH');
            console.log('✅ Firebase AI Logic public-client smoke PASS · real model response observed.');
          } finally {
            await deleteApp(app).catch(() => {});
          }
          NODE

      - name: Build current web bundle
        run: npm run build

      - name: Install native dependencies
        run: npm run deps:mobile

      - name: Verify native dependency install did not mutate manifests
        run: git diff --exit-code -- package.json package-lock.json

      - name: Generate Android project and version
        run: |
          npm run android:bootstrap
          node scripts/configure-android-beta-version.mjs
          npm run android:doctor

      - name: Verify Android privacy and repaired capability boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/google-services.json
          grep -q 'tutop-beta-vicmdlb-1356585881' android/app/google-services.json
          ! grep -q 'tutop-3a4f7' android/app/google-services.json
          grep -q 'versionCode 90200' android/app/build.gradle
          grep -q 'versionName "0.9.2-beta.0"' android/app/build.gradle
          grep -q 'ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
          ! grep -q 'ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          ! grep -q 'ACCESS_BACKGROUND_LOCATION' android/app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          grep -q 'photopicker_activity:0:required' android/app/src/main/AndroidManifest.xml
          grep -q 'tools:ignore="MissingClass"' android/app/src/main/AndroidManifest.xml
          grep -q 'RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -q 'class TuTopVoicePlugin' android/app/src/main/java/mx/tutop/app/TuTopVoicePlugin.java
          grep -q 'class TuTopAIPlugin' android/app/src/main/java/mx/tutop/app/TuTopAIPlugin.java
          grep -q 'usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'allowBackup="false"' android/app/src/main/AndroidManifest.xml

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v6

      - name: Android lint, unit tests and APK assembly
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean lintDebug testDebugUnitTest assembleDebug

      - name: Stage APK and checksum
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "$TUTOP_APK_PATH"
          APK_SHA256="$(sha256sum "$TUTOP_APK_PATH" | awk '{print $1}')"
          APK_SIZE="$(wc -c < "$TUTOP_APK_PATH" | tr -d ' ')"
          printf '%s  %s\n' "$APK_SHA256" "$TUTOP_APK_PATH" > "$TUTOP_APK_SHA256_PATH"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "APK sha256=$APK_SHA256 size=$APK_SIZE"

      - name: Upload immutable APK artifact
        id: upload-apk
        uses: actions/upload-artifact@v7
        with:
          name: TuTop-0.9.2-beta.0-hosted-client-physical-qa-${{ github.run_number }}
          path: |
            TuTop-0.9.2-beta.0-physical-qa-staging.apk
            TuTop-0.9.2-beta.0-physical-qa-staging.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Create transparent client-QA provenance record
        env:
          TUTOP_UPLOAD_ARTIFACT_ID: ${{ steps.upload-apk.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          record = {
              'schema': 'tutop.client-physical-qa-candidate.v1',
              'app_version': '0.9.2-beta.0',
              'current_source_sha': os.environ['GITHUB_SHA'],
              'validated_backend_base_sha': os.environ['TUTOP_VALIDATED_BASE_SHA'],
              'validated_backend_base_run_id': int(os.environ['TUTOP_VALIDATED_BASE_RUN_ID']),
              'backend_rules_changed_since_base': False,
              'evidence_inheritance_scope': 'backend/rules only; current client/native code rebuilt and tested separately',
              'public_client_firebase_ai_smoke': True,
              'artifact_id': int(os.environ['TUTOP_UPLOAD_ARTIFACT_ID']),
              'apk_sha256': pathlib.Path(os.environ['TUTOP_APK_SHA256_PATH']).read_text().split()[0],
              'physical_qa_candidate': True,
              'release_candidate': False,
              'production_ready': False,
              'play_ready': False,
              'notes': 'Hosted zero-spend rescue for physical device QA while self-hosted exact-SHA staging runner is unavailable.',
          }
          pathlib.Path('CLIENT_QA_CANDIDATE_0.9.2.hosted.json').write_text(json.dumps(record, indent=2) + '\n')
          PY

      - name: Upload transparent provenance evidence
        uses: actions/upload-artifact@v7
        with:
          name: TuTop-0.9.2-beta.0-hosted-client-evidence-${{ github.run_number }}
          path: CLIENT_QA_CANDIDATE_0.9.2.hosted.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish private client-QA prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="tutop-0.9.2-beta.0-hosted-client-qa-${GITHUB_RUN_NUMBER}"
          TITLE="TuTop 0.9.2 beta.0 Client Physical QA — build ${GITHUB_RUN_NUMBER}"
          NOTES="Private physical-device QA candidate only; not a final release candidate and not production/Play-ready. Current source SHA=${GITHUB_SHA}. Backend/rules evidence is inherited only from fully validated unchanged base ${TUTOP_VALIDATED_BASE_SHA} / run ${TUTOP_VALIDATED_BASE_RUN_ID}; this workflow independently rebuilds and tests the current client/native surfaces and proves a real Firebase AI public-client response. APK artifact=${{ steps.upload-apk.outputs.artifact-id }}; SHA256=${{ steps.stage.outputs.apk_sha256 }}."
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --prerelease \
            "$TUTOP_APK_PATH" "$TUTOP_APK_SHA256_PATH" CLIENT_QA_CANDIDATE_0.9.2.hosted.json

      - name: Remove recovered Firebase client configs
        if: always()
        run: rm -f .tutop-staging-web-config.json .tutop-staging-google-services.json android/app/google-services.json
