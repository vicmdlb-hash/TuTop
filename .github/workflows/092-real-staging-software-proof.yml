name: TuTop 0.9.2 real staging software proof

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TUTOP_FIREBASE_PROJECT_ID: tutop-beta-vicmdlb-1356585881
  TUTOP_STAGING_WEB_CONFIG_PATH: .tutop-staging-web-config.json
  TUTOP_ALLOW_FIREBASE_DEPLOY: staging-v2
  TUTOP_ALLOW_V2_SEED: staging-v2
  TUTOP_ALLOW_APP_CHECK: staging-v2
  TUTOP_BETA_VERSION: 0.9.2-beta.0
  TUTOP_AI_APP_CHECK_REQUIRED: "false"
  VITE_TUTOP_MEDIA_STORAGE_ENABLED: "false"
  FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
  TUTOP_FIREBASE_OAUTH_CLIENT_ID: ${{ secrets.FIREBASE_OAUTH_CLIENT_ID }}
  TUTOP_FIREBASE_OAUTH_CLIENT_SECRET: ${{ secrets.FIREBASE_OAUTH_CLIENT_SECRET }}

concurrency:
  group: tutop-092-real-staging-${{ github.sha }}
  cancel-in-progress: false

jobs:
  staging-proof:
    name: Real Firebase AI + publication proof (manual hosted diagnostic, no APK)
    if: github.ref_name == 'feat/tutop-0.9.2-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install exact app dependencies
        run: npm ci

      - name: Establish exact-SHA software gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "$TUTOP_BETA_VERSION"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm run check
          npm run typecheck
          node scripts/device-ux-ai-092-contract-tests.mjs
          npm run listing-schema-v2:test
          {
            echo "TUTOP_VALIDATED_GATE_RUN_ID=$GITHUB_RUN_ID"
            echo "TUTOP_VALIDATED_GATE_SHA=$GITHUB_SHA"
          } >> "$GITHUB_ENV"

      - name: Resolve managed Firebase credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_TOKEN:-}" ] || [ -z "${TUTOP_FIREBASE_OAUTH_CLIENT_ID:-}" ] || [ -z "${TUTOP_FIREBASE_OAUTH_CLIENT_SECRET:-}" ]; then
            echo "DETENIDO: el diagnóstico hospedado requiere los tres secrets Firebase administrados; usa el workflow integral self-hosted con ADC para la prueba autoritativa." >&2
            exit 42
          fi
          echo "TUTOP_FIREBASE_AUTH_MODE=managed_refresh_token" >> "$GITHUB_ENV"

      - name: Install Firebase JS client only for real staging proof
        run: npm install --no-save --package-lock=false --no-audit --no-fund firebase@12.18.0

      - name: Verify dependency manifests stayed immutable
        run: git diff --exit-code -- package.json package-lock.json

      - name: Deploy strict V2 Firestore rules and indexes
        run: npm run firebase:deploy:staging

      - name: Verify composite indexes
        run: node scripts/staging-index-readiness-smoke.mjs

      - name: Verify canonical university catalog
        run: npm run v2:catalog:seed

      - name: Enable base Firebase Authentication only
        run: node scripts/deploy-firebase-auth-staging.mjs

      - name: Prepare staging web config
        run: node scripts/prepare-staging-v2-auth.mjs

      - name: Keep App Check UNENFORCED for private 0.9.2 QA
        env:
          TUTOP_APP_CHECK_MODE: UNENFORCED
          TUTOP_APP_CHECK_AI_MODE: UNENFORCED
        run: node scripts/configure-app-check-staging.mjs

      - name: Prove real Firebase AI Logic response
        env:
          TUTOP_TOPI_AI_MODEL: gemini-3.8-flash
        run: node scripts/staging-topi-ai-runtime-smoke.mjs

      - name: Prove real two-user publication and transaction flow
        run: node scripts/staging-v2-e2e-smoke.mjs

      - name: Re-verify App Check isolation
        env:
          TUTOP_APP_CHECK_MODE: UNENFORCED
          TUTOP_APP_CHECK_AI_MODE: UNENFORCED
        run: node scripts/configure-app-check-staging.mjs

      - name: Confirm no unauthorized Storage or billing activation
        shell: bash
        run: |
          set -euo pipefail
          test "${VITE_TUTOP_MEDIA_STORAGE_ENABLED}" = "false"
          grep -q 'product-videos/{uid}' firebase/storage.rules
          echo "✅ Manual hosted staging diagnostic complete; video remains infrastructure-gated and Storage/billing was not enabled."
