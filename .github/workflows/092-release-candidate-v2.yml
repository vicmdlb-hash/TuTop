name: TuTop 0.9.2 full quality + Physical QA candidate

on:
  push:
    branches:
      - feat/tutop-0.9.2-hardening
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tutop-092-full-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  TUTOP_FIREBASE_PROJECT_ID: tutop-beta-vicmdlb-1356585881
  TUTOP_STAGING_WEB_CONFIG_PATH: .tutop-staging-web-config.json
  TUTOP_ANDROID_GOOGLE_SERVICES_PATH: .tutop-staging-google-services.json
  TUTOP_ALLOW_FIREBASE_DEPLOY: staging-v2
  TUTOP_ALLOW_V2_SEED: staging-v2
  TUTOP_ALLOW_ANDROID_APP_SETUP: staging-v2
  TUTOP_ALLOW_APP_CHECK: staging-v2
  TUTOP_ANDROID_PACKAGE_NAME: mx.tutop.app
  TUTOP_BETA_VERSION: 0.9.2-beta.0
  TUTOP_ANDROID_VERSION_CODE: 90200
  TUTOP_APK_PATH: TuTop-0.9.2-beta.0-physical-qa-staging.apk
  TUTOP_APK_SHA256_PATH: TuTop-0.9.2-beta.0-physical-qa-staging.apk.sha256
  TUTOP_CANDIDATE_OUTPUT_PATH: PHYSICAL_QA_CANDIDATE_0.9.2.generated.json
  TUTOP_AI_APP_CHECK_REQUIRED: "false"
  VITE_TUTOP_TOPI_REMOTE_ENABLED: "false"
  VITE_TUTOP_V2_REVIEWS_LAZY_CUTOVER: "false"
  VITE_TUTOP_V2_WALLET_LAZY_CUTOVER: "false"
  VITE_TUTOP_V2_FAVORITES_VISIBLE_CUTOVER: "false"
  FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
  TUTOP_FIREBASE_OAUTH_CLIENT_ID: ${{ secrets.FIREBASE_OAUTH_CLIENT_ID }}
  TUTOP_FIREBASE_OAUTH_CLIENT_SECRET: ${{ secrets.FIREBASE_OAUTH_CLIENT_SECRET }}

jobs:
  quality-staging-android:
    name: 0.9.2 complete quality + real staging + Android
    if: github.ref_name == 'feat/tutop-0.9.2-hardening'
    # Public repository: standard GitHub-hosted runners are zero-spend and avoid
    # making release proof depend on Víctor's laptop/WSL availability.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      apk_artifact_id: ${{ steps.upload-apk.outputs.artifact-id }}
      apk_artifact_name: ${{ steps.names.outputs.apk_artifact_name }}
      candidate_artifact_name: ${{ steps.names.outputs.candidate_artifact_name }}
      apk_sha256: ${{ steps.stage.outputs.apk_sha256 }}
    steps:
      - name: Checkout exact 0.9.2 SHA
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Require exact normalized 0.9.2 source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/tutop-0.9.2-hardening"
          test "$(node -p "require('./package.json').version")" = "$TUTOP_BETA_VERSION"
          test "$(node -p "require('./package-lock.json').version")" = "$TUTOP_BETA_VERSION"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "$TUTOP_BETA_VERSION"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            echo "TUTOP_VALIDATED_GATE_RUN_ID=$GITHUB_RUN_ID"
            echo "TUTOP_VALIDATED_GATE_SHA=$GITHUB_SHA"
          } >> "$GITHUB_ENV"

      - name: Resolve and prove staging Firebase credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            if [ -n "${TUTOP_FIREBASE_OAUTH_CLIENT_ID:-}" ] && [ -n "${TUTOP_FIREBASE_OAUTH_CLIENT_SECRET:-}" ]; then
              AUTH_MODE="managed_refresh_token"
            elif [ -z "${TUTOP_FIREBASE_OAUTH_CLIENT_ID:-}" ] && [ -z "${TUTOP_FIREBASE_OAUTH_CLIENT_SECRET:-}" ]; then
              AUTH_MODE="firebase_cli_refresh_token"
            else
              echo "DETENIDO: OAuth Firebase CI configurado parcialmente." >&2
              exit 42
            fi
            ACCESS_TOKEN="$(node --input-type=module -e "import('./scripts/firebase-ci-auth.mjs').then(async m => process.stdout.write(await m.firebaseCiAccessToken())).catch(e => { console.error(e.message); process.exit(1); })")"
            if [ "${#ACCESS_TOKEN}" -lt 100 ]; then
              echo "DETENIDO: Firebase CI no produjo un access token válido." >&2
              exit 42
            fi
            echo "::add-mask::$ACCESS_TOKEN"
            {
              echo "TUTOP_FIREBASE_ACCESS_TOKEN=$ACCESS_TOKEN"
              echo "TUTOP_FIREBASE_AUTH_MODE=$AUTH_MODE"
            } >> "$GITHUB_ENV"
            echo "✅ Firebase credential exchange PASS mode=$AUTH_MODE (token masked)."
            exit 0
          fi
          if command -v gcloud >/dev/null 2>&1; then
            ACCESS_TOKEN="$(gcloud auth application-default print-access-token 2>/dev/null || true)"
            if [ -n "$ACCESS_TOKEN" ]; then
              echo "::add-mask::$ACCESS_TOKEN"
              {
                echo "TUTOP_FIREBASE_ACCESS_TOKEN=$ACCESS_TOKEN"
                echo "TUTOP_FIREBASE_AUTH_MODE=local_adc"
                echo "FIREBASE_TOKEN="
                echo "TUTOP_FIREBASE_OAUTH_CLIENT_ID="
                echo "TUTOP_FIREBASE_OAUTH_CLIENT_SECRET="
              } >> "$GITHUB_ENV"
              exit 0
            fi
          fi
          echo "DETENIDO: staging 0.9.2 no tiene credencial Firebase utilizable." >&2
          exit 42

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Install exact app dependencies
        run: npm ci

      - name: Full TuTop regression and policy suite
        run: npm run check

      - name: TypeScript gate
        run: npm run typecheck

      - name: 0.9.2 UX and native repair assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q "return value === 'dark'" src/lib/theme091.ts
          grep -q "return 'dark'" src/lib/theme091.ts
          grep -q "chooseFromGallery" src/services/nativeDeviceCapabilities.ts
          grep -q "takePhoto" src/services/nativeDeviceCapabilities.ts
          grep -q "EXTRA_PARTIAL_RESULTS" scripts/android-topi-voice-plugin.mjs
          grep -q "Firebase AI real" src/components/NationalPublishScreen.tsx
          grep -q "Guía local" src/components/TopiSupportAssistant.tsx
          grep -q "refreshLocation" src/components/NationalPublishScreen.tsx
          grep -q "Publicación creada y enviada a revisión" src/components/NationalPublishScreen.tsx

      - name: Install Firebase JS client only for real staging proof
        run: npm install --no-save --package-lock=false --no-audit --no-fund firebase@12.18.0

      - name: Verify dependency manifests stayed immutable
        run: git diff --exit-code -- package.json package-lock.json

      - name: Deploy strict V2 staging rules and indexes
        run: npm run firebase:deploy:staging

      - name: Verify composite indexes
        run: node scripts/staging-index-readiness-smoke.mjs

      - name: Verify canonical catalog
        run: npm run v2:catalog:seed

      - name: Enable base Firebase Authentication only
        run: node scripts/deploy-firebase-auth-staging.mjs

      - name: Prepare staging Web config
        run: node scripts/prepare-staging-v2-auth.mjs

      - name: Keep App Check UNENFORCED only for private 0.9.2 physical QA
        env:
          TUTOP_APP_CHECK_MODE: UNENFORCED
          TUTOP_APP_CHECK_AI_MODE: UNENFORCED
        run: node scripts/configure-app-check-staging.mjs

      - name: Prove real Firebase AI Logic response
        env:
          TUTOP_TOPI_AI_MODEL: gemini-3.8-flash
        run: node scripts/staging-topi-ai-runtime-smoke.mjs

      - name: Provision and validate staging Android Firebase app
        run: node scripts/prepare-staging-android-app.mjs

      - name: Real two-user marketplace publication and transaction smoke
        run: node scripts/staging-v2-e2e-smoke.mjs

      - name: Real controlled account erasure smoke
        env:
          TUTOP_ALLOW_ACCOUNT_ERASURE: staging-reviewed
        run: node scripts/staging-account-erasure-smoke.mjs

      - name: Apply approved one-shot full beta account reset
        env:
          TUTOP_STAGING_RESET_ACK: DELETE_ALL_BETA_ACCOUNTS
        run: node scripts/reset-staging-accounts.mjs --apply

      - name: Prove fresh registration and immediate publication after reset
        run: node scripts/staging-app-registration-smoke.mjs

      - name: Re-verify App Check isolation after real smoke
        env:
          TUTOP_APP_CHECK_MODE: UNENFORCED
          TUTOP_APP_CHECK_AI_MODE: UNENFORCED
        run: node scripts/configure-app-check-staging.mjs

      - name: Bind staging evidence to exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "TUTOP_VALIDATED_STAGING_RUN_ID=$GITHUB_RUN_ID"
            echo "TUTOP_VALIDATED_STAGING_SHA=$GITHUB_SHA"
          } >> "$GITHUB_ENV"

      - name: Prepare staging Android Firebase config
        run: node scripts/prepare-staging-android-app.mjs

      - name: Export 0.9.2 private QA build environment
        env:
          TUTOP_AI_APP_CHECK_REQUIRED: "false"
        run: node scripts/export-staging-v2-build-env.mjs

      - name: Build production-shape web bundle
        run: npm run build

      - name: Install Capacitor and native Firebase plugins
        run: npm run deps:mobile

      - name: Verify mobile dependency install did not mutate manifests
        run: git diff --exit-code -- package.json package-lock.json

      - name: Generate Android project with camera gallery location voice and AI repairs
        run: npm run android:bootstrap

      - name: Set Android 0.9.2 versionCode 90200
        run: node scripts/configure-android-beta-version.mjs

      - name: Android doctor
        run: npm run android:doctor

      - name: Verify staging native configuration and privacy boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/google-services.json
          grep -q 'tutop-beta-vicmdlb-1356585881' android/app/google-services.json
          ! grep -q 'tutop-3a4f7' android/app/google-services.json
          grep -q 'versionCode 90200' android/app/build.gradle
          grep -q 'versionName "0.9.2-beta.0"' android/app/build.gradle
          grep -q 'ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
          ! grep -q 'ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          ! grep -q 'ACCESS_BACKGROUND_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -q 'class TuTopVoicePlugin' android/app/src/main/java/mx/tutop/app/TuTopVoicePlugin.java
          grep -q 'class TuTopAIPlugin' android/app/src/main/java/mx/tutop/app/TuTopAIPlugin.java
          grep -q 'usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'allowBackup="false"' android/app/src/main/AndroidManifest.xml

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Android clean lint unit tests and APK assembly
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean lintDebug testDebugUnitTest assembleDebug

      - name: Stage APK and checksum
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "$TUTOP_APK_PATH"
          APK_SHA256="$(sha256sum "$TUTOP_APK_PATH" | awk '{print $1}')"
          printf '%s  %s\n' "$APK_SHA256" "$TUTOP_APK_PATH" > "$TUTOP_APK_SHA256_PATH"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "APK staged sha256=$APK_SHA256"

      - name: Name immutable artifacts
        id: names
        shell: bash
        run: |
          echo "apk_artifact_name=TuTop-0.9.2-beta.0-physical-qa-staging-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "candidate_artifact_name=TuTop-0.9.2-beta.0-physical-qa-candidate-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload APK and checksum
        id: upload-apk
        uses: actions/upload-artifact@v7
        with:
          name: TuTop-0.9.2-beta.0-physical-qa-staging-${{ github.run_number }}
          path: |
            TuTop-0.9.2-beta.0-physical-qa-staging.apk
            TuTop-0.9.2-beta.0-physical-qa-staging.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Generate final metadata and exact-head candidate manifest
        env:
          TUTOP_UPLOAD_ARTIFACT_ID: ${{ steps.upload-apk.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          APK_SHA256="$(awk '{print $1; exit}' "$TUTOP_APK_SHA256_PATH")"
          APK_SIZE="$(wc -c < "$TUTOP_APK_PATH" | tr -d ' ')"
          cat > TuTop-0.9.2-beta.0-physical-qa-staging.metadata.txt <<EOF
          head_sha=${GITHUB_SHA}
          gate_run_id=${TUTOP_VALIDATED_GATE_RUN_ID}
          gate_head_sha=${TUTOP_VALIDATED_GATE_SHA}
          staging_smoke_run_id=${TUTOP_VALIDATED_STAGING_RUN_ID}
          staging_smoke_head_sha=${TUTOP_VALIDATED_STAGING_SHA}
          firebase_project=${TUTOP_FIREBASE_PROJECT_ID}
          version=${TUTOP_BETA_VERSION}
          version_code=${TUTOP_ANDROID_VERSION_CODE}
          artifact_id=${TUTOP_UPLOAD_ARTIFACT_ID}
          build_run_id=${GITHUB_RUN_ID}
          build_run_number=${GITHUB_RUN_NUMBER}
          build_tree_sha=${BUILD_TREE_SHA}
          apk_sha256=${APK_SHA256}
          apk_size_bytes=${APK_SIZE}
          ai_provider=firebase-ai-logic
          ai_app_check_required=false
          reviews_lazy_cutover=${VITE_TUTOP_V2_REVIEWS_LAZY_CUTOVER}
          wallet_lazy_cutover=${VITE_TUTOP_V2_WALLET_LAZY_CUTOVER}
          favorites_visible_cutover=${VITE_TUTOP_V2_FAVORITES_VISIBLE_CUTOVER}
          EOF
          node scripts/generate-physical-qa-candidate.mjs
          node scripts/verify-generated-physical-qa-candidate.mjs "$TUTOP_CANDIDATE_OUTPUT_PATH" TuTop-0.9.2-beta.0-physical-qa-staging.metadata.txt

      - name: Upload candidate provenance evidence
        uses: actions/upload-artifact@v7
        with:
          name: TuTop-0.9.2-beta.0-physical-qa-candidate-${{ github.run_number }}
          path: |
            PHYSICAL_QA_CANDIDATE_0.9.2.generated.json
            TuTop-0.9.2-beta.0-physical-qa-staging.metadata.txt
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary Firebase configs
        if: always()
        run: rm -f .tutop-staging-web-config.json .tutop-staging-google-services.json android/app/google-services.json

  independent-verification:
    name: Independent APK hash and provenance verification
    needs: quality-staging-android
    if: needs.quality-staging-android.result == 'success'
    # Separate job => fresh VM independent of the builder.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      verified_sha256: ${{ steps.verify.outputs.verified_sha256 }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.quality-staging-android.outputs.apk_artifact_name }}
          path: verify-apk

      - name: Download candidate evidence
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.quality-staging-android.outputs.candidate_artifact_name }}
          path: verify-candidate

      - name: Independently verify APK and candidate binding
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="verify-apk/TuTop-0.9.2-beta.0-physical-qa-staging.apk"
          HASH="verify-apk/TuTop-0.9.2-beta.0-physical-qa-staging.apk.sha256"
          META="verify-candidate/TuTop-0.9.2-beta.0-physical-qa-staging.metadata.txt"
          CANDIDATE="verify-candidate/PHYSICAL_QA_CANDIDATE_0.9.2.generated.json"
          test -s "$APK" && test -s "$HASH" && test -s "$META" && test -s "$CANDIDATE"
          EXPECTED="$(awk '{print $1; exit}' "$HASH")"
          ACTUAL="$(sha256sum "$APK" | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"
          test "$ACTUAL" = "${{ needs.quality-staging-android.outputs.apk_sha256 }}"
          grep -q "head_sha=${GITHUB_SHA}" "$META"
          grep -q 'version=0.9.2-beta.0' "$META"
          grep -q 'version_code=90200' "$META"
          grep -q 'firebase_project=tutop-beta-vicmdlb-1356585881' "$META"
          grep -q 'ai_provider=firebase-ai-logic' "$META"
          grep -q 'ai_app_check_required=false' "$META"
          grep -q 'reviews_lazy_cutover=false' "$META"
          grep -q 'wallet_lazy_cutover=false' "$META"
          grep -q 'favorites_visible_cutover=false' "$META"
          node - <<'NODE'
          const fs = require('fs');
          const candidate = JSON.parse(fs.readFileSync('verify-candidate/PHYSICAL_QA_CANDIDATE_0.9.2.generated.json', 'utf8'));
          const sha = process.env.GITHUB_SHA;
          if (candidate.build_commit_sha !== sha) process.exit(2);
          if (candidate.gate_commit_sha !== sha) process.exit(3);
          if (candidate.staging_smoke_commit_sha !== sha) process.exit(4);
          if (candidate.app_version !== '0.9.2-beta.0') process.exit(5);
          NODE
          echo "verified_sha256=$ACTUAL" >> "$GITHUB_OUTPUT"
          echo "✅ independent 0.9.2 verification PASS sha256=$ACTUAL"

  durable-prerelease:
    name: Publish verified 0.9.2 private prerelease
    needs: [quality-staging-android, independent-verification]
    if: needs.independent-verification.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.quality-staging-android.outputs.apk_artifact_name }}
          path: release-files

      - name: Download candidate evidence
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.quality-staging-android.outputs.candidate_artifact_name }}
          path: candidate-files

      - name: Publish durable prerelease with transient retry
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="tutop-0.9.2-beta.0-physical-qa-${GITHUB_RUN_NUMBER}"
          TITLE="TuTop 0.9.2 beta.0 Physical QA — build ${GITHUB_RUN_NUMBER}"
          NOTES="Private staging candidate only; not production/Play-ready. Exact SHA=${GITHUB_SHA}. APK artifact=${{ needs.quality-staging-android.outputs.apk_artifact_id }}. Independently verified SHA256=${{ needs.independent-verification.outputs.verified_sha256 }}. Includes dark-default UX, Camera 8 gallery/camera flow, approximate-location retry, improved es-MX voice capture, explicit real-AI/local status and hardened publication handling. Firebase AI Logic is proven against staging; AI App Check remains UNENFORCED only for this private sideload QA candidate."
          publish_once() {
            if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --prerelease
            fi
            gh release upload "$TAG" release-files/TuTop-0.9.2-beta.0-physical-qa-staging.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release upload "$TAG" release-files/TuTop-0.9.2-beta.0-physical-qa-staging.apk.sha256 --repo "$GITHUB_REPOSITORY" --clobber
            gh release upload "$TAG" candidate-files/TuTop-0.9.2-beta.0-physical-qa-staging.metadata.txt --repo "$GITHUB_REPOSITORY" --clobber
            gh release upload "$TAG" candidate-files/PHYSICAL_QA_CANDIDATE_0.9.2.generated.json --repo "$GITHUB_REPOSITORY" --clobber
          }
          for attempt in 1 2 3 4 5; do
            if publish_once; then
              echo "✅ durable TuTop 0.9.2 prerelease published: $TAG"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep "$((attempt * 10))"
            fi
          done
          echo "DETENIDO: prerelease publish failed after retries; verified artifacts remain preserved." >&2
          exit 1
