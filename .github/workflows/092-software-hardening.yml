name: TuTop 0.9.2 software hardening

on:
  push:
    branches:
      - feat/tutop-0.9.2-hardening
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tutop-092-software-${{ github.sha }}
  cancel-in-progress: false

env:
  TUTOP_BETA_VERSION: 0.9.2-beta.0
  TUTOP_ANDROID_VERSION_CODE: 90200
  TUTOP_FIREBASE_PROJECT_ID: tutop-beta-vicmdlb-1356585881
  TUTOP_ANDROID_PACKAGE_NAME: mx.tutop.app
  TUTOP_VALIDATED_BASE_RUN_ID: "34772848879"
  TUTOP_VALIDATED_BASE_ARTIFACT: TuTop-0.9.2-beta.0-physical-qa-staging-12
  VITE_TUTOP_SCHEMA_V2: "true"
  VITE_TUTOP_ENVIRONMENT: staging
  VITE_TUTOP_APP_VERSION: 0.9.2-beta.0
  VITE_TUTOP_TOPI_FIREBASE_AI_ENABLED: "true"
  VITE_TUTOP_TOPI_MODEL: gemini-3.8-flash
  VITE_TUTOP_TOPI_REMOTE_ENABLED: "false"
  VITE_TUTOP_AI_APP_CHECK_REQUIRED: "false"
  VITE_TUTOP_MEDIA_STORAGE_ENABLED: "false"
  VITE_TUTOP_V2_REVIEWS_LAZY_CUTOVER: "false"
  VITE_TUTOP_V2_WALLET_LAZY_CUTOVER: "false"
  VITE_TUTOP_V2_FAVORITES_VISIBLE_CUTOVER: "false"

jobs:
  software:
    name: Web + native Android software gates (no APK promotion)
    if: github.ref_name == 'feat/tutop-0.9.2-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Install exact dependencies
        run: npm ci

      - name: Full app regression + contracts
        run: |
          npm run check
          npm run typecheck
          node scripts/device-ux-ai-092-contract-tests.mjs
          npm run listing-schema-v2:test

      - name: Rules R1 — base generator
        run: node scripts/prepare-firestore-v2-rules.mjs
      - name: Rules R2 — canonical listing hardener
        run: node scripts/harden-canonical-v2-rules.mjs
      - name: Rules R3 — runtime hardener
        run: node scripts/harden-runtime-v2-rules.mjs
      - name: Rules R4 — listing rate-limit optimizer
        run: node scripts/optimize-listing-rate-limit-rules.mjs
      - name: Rules R5 — account operations hardener
        run: node scripts/harden-account-operations-rules.mjs
      - name: Rules R6 — notification receipts hardener
        run: node scripts/harden-notification-receipts-rules.mjs
      - name: Rules R7 — transaction lock hardener
        run: node scripts/harden-transaction-lock-rules.mjs
      - name: Rules R8 — nearby semantics hardener
        run: node scripts/harden-nearby-v2-rules.mjs
      - name: Rules R9 — listing video hardener
        run: node scripts/harden-listing-video-rules.mjs
      - name: Rules R10 — static final assertions
        run: |
          grep -q "video_urls" firebase/firestore.v2.generated.rules
          grep -q "firebase-storage://" firebase/firestore.v2.generated.rules
          grep -q "product-videos" firebase/storage.rules

      - name: Recover validated public Firebase Android configuration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tutop-validated-base
          gh run download "$TUTOP_VALIDATED_BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$TUTOP_VALIDATED_BASE_ARTIFACT" --dir /tmp/tutop-validated-base
          python3 - <<'PY'
          import json, re, zipfile, pathlib
          apk = pathlib.Path('/tmp/tutop-validated-base/TuTop-0.9.2-beta.0-physical-qa-staging.apk')
          if not apk.is_file():
              raise SystemExit('VALIDATED_BASE_APK_MISSING')
          project = 'tutop-beta-vicmdlb-1356585881'
          package = 'mx.tutop.app'
          raw = apk.read_bytes()
          def one(pattern, data, label):
              m = re.search(pattern, data)
              if not m:
                  raise SystemExit('MISSING_VALIDATED_CLIENT_VALUE:' + label)
              value = m.group(1)
              return value.decode() if isinstance(value, bytes) else value
          android_app = one(rb'(1:900056291310:android:[0-9a-f]+)', raw, 'android_app_id')
          android_key = one(rb'(AIza[0-9A-Za-z_-]{30,50})', raw, 'android_api_key')
          storage = one(rb'(tutop-beta-vicmdlb-1356585881(?:\.firebasestorage\.app|\.appspot\.com))', raw, 'storage_bucket')
          pathlib.Path('.tutop-staging-google-services.json').write_text(json.dumps({
              'project_info': {
                  'project_number': '900056291310',
                  'project_id': project,
                  'storage_bucket': storage,
              },
              'client': [{
                  'client_info': {
                      'mobilesdk_app_id': android_app,
                      'android_client_info': {'package_name': package},
                  },
                  'oauth_client': [],
                  'api_key': [{'current_key': android_key}],
                  'services': {'appinvite_service': {'other_platform_oauth_client': []}},
              }],
              'configuration_version': '1',
          }))
          print('::add-mask::' + android_key)
          print('::add-mask::' + android_app)
          print('✅ Configuración pública Android Firebase recuperada de evidencia validada; no se copiaron credenciales privilegiadas.')
          PY

      - name: Build web bundle
        run: npm run build

      - name: Install ephemeral mobile dependencies
        run: npm run deps:mobile

      - name: Keep manifests immutable
        run: git diff --exit-code -- package.json package-lock.json

      - name: Generate hardened Android project
        env:
          TUTOP_ANDROID_GOOGLE_SERVICES_PATH: .tutop-staging-google-services.json
        run: |
          npm run android:bootstrap
          node scripts/configure-android-beta-version.mjs
          npm run android:doctor

      - name: Verify Android privacy/capability boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/google-services.json
          grep -q 'tutop-beta-vicmdlb-1356585881' android/app/google-services.json
          grep -q 'versionCode 90200' android/app/build.gradle
          grep -q 'versionName "0.9.2-beta.0"' android/app/build.gradle
          grep -q 'ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
          ! grep -q 'ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          ! grep -q 'ACCESS_BACKGROUND_LOCATION' android/app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          ! grep -q 'READ_EXTERNAL_STORAGE' android/app/src/main/AndroidManifest.xml
          ! grep -q 'WRITE_EXTERNAL_STORAGE' android/app/src/main/AndroidManifest.xml
          grep -q 'RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -q 'photopicker_activity:0:required' android/app/src/main/AndroidManifest.xml
          grep -q 'class TuTopVoicePlugin' android/app/src/main/java/mx/tutop/app/TuTopVoicePlugin.java
          grep -q 'class TuTopAIPlugin' android/app/src/main/java/mx/tutop/app/TuTopAIPlugin.java
          grep -q 'usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'allowBackup="false"' android/app/src/main/AndroidManifest.xml

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v6

      - name: Android lint, unit tests and debug assembly proof
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean lintDebug testDebugUnitTest assembleDebug

      - name: No release artifact in software-only workflow
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          echo "✅ Software hardening gates complete. APK was compiled only as proof and was not uploaded/promoted."

      - name: Remove recovered Firebase config
        if: always()
        run: rm -f .tutop-staging-google-services.json android/app/google-services.json
