name: Build TuTop Android APK (zero cost)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tutop-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firestore-rules:
    name: Firestore security rules
    if: github.ref_name != 'feat/tutop-0.8-p0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install web dependencies
        run: npm ci
      - name: Install emulator test dependencies (ephemeral)
        run: npm install --no-save --package-lock=false --no-audit --no-fund firebase@12.18.0 @firebase/rules-unit-testing@latest
      - name: Verify dependency manifests stayed immutable
        run: git diff --exit-code -- package.json package-lock.json
      - name: Execute Firestore rules tests
        run: npx --yes firebase-tools@15.29.0 emulators:exec --project demo-tutop-rules-test --only firestore "node --test tests/firestore.rules.test.mjs"

  android-debug-apk:
    name: TuTop stable debug APK
    if: github.ref_name != 'feat/tutop-0.8-p0'
    needs: firestore-rules
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install web dependencies
        run: npm ci
      - name: Static checks
        run: npm run check
      - name: GitHub readiness gate
        run: npm run github:ready
      - name: Beta readiness gate
        run: npm run beta:ready
      - name: Typecheck
        run: npm run typecheck
      - name: Build web app
        run: npm run build
      - name: Install Capacitor Android stack
        run: npm run deps:mobile
      - name: Verify dependency manifests stayed immutable
        run: git diff --exit-code -- package.json package-lock.json
      - name: Generate Android project
        run: npm run android:bootstrap
      - name: Android doctor
        run: npm run android:doctor
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean lintDebug testDebugUnitTest assembleDebug
      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee TuTop-debug.apk.sha256
          cp "$APK" TuTop-debug.apk
      - name: Upload TuTop APK
        uses: actions/upload-artifact@v7
        with:
          name: TuTop-Android-debug-${{ github.run_number }}
          path: |
            TuTop-debug.apk
            TuTop-debug.apk.sha256
          if-no-files-found: error
          retention-days: 90

  android-v2-staging:
    name: TuTop 0.9 V2 physical QA staging APK
    if: github.ref_name == 'feat/tutop-0.8-p0'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      TUTOP_FIREBASE_PROJECT_ID: tutop-beta-vicmdlb-1356585881
      TUTOP_STAGING_WEB_CONFIG_PATH: .tutop-staging-web-config.json
      TUTOP_ANDROID_GOOGLE_SERVICES_PATH: .tutop-staging-google-services.json
      TUTOP_ALLOW_ANDROID_APP_SETUP: staging-v2
      TUTOP_ANDROID_PACKAGE_NAME: mx.tutop.app
      TUTOP_BETA_VERSION: 0.9.0-beta.0
      TUTOP_ANDROID_VERSION_CODE: 90000
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout feature ref
        uses: actions/checkout@v7
      - name: Guard staging credential
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/tutop-0.8-p0"
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "DETENIDO: falta FIREBASE_TOKEN en GitHub Actions." >&2
            exit 42
          fi
      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install web dependencies
        run: npm ci
      - name: Static and policy gates
        run: |
          npm run check
          npm run github:ready
          npm run beta:ready
          npm run v2:staging:readiness:test
          npm run v2:rules:prepare
          npm run native-security:test
          npm run account-erasure:test
          npm run typecheck
      - name: Prepare staging Firebase Web config
        run: node scripts/prepare-staging-v2-auth.mjs
      - name: Prepare staging Firebase Android app config
        run: node scripts/prepare-staging-android-app.mjs
      - name: Export V2 staging build environment
        run: node scripts/export-staging-v2-build-env.mjs
      - name: Build V2 web bundle
        run: npm run build
      - name: Install Capacitor + native Firebase plugins
        run: npm run deps:mobile
      - name: Verify dependency manifests stayed immutable
        run: git diff --exit-code -- package.json package-lock.json
      - name: Generate Android project
        run: npm run android:bootstrap
      - name: Fix Android beta version
        run: node scripts/configure-android-beta-version.mjs
      - name: Android doctor
        run: npm run android:doctor
      - name: Verify staging-only native config
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/google-services.json
          grep -q 'tutop-beta-vicmdlb-1356585881' android/app/google-services.json
          if grep -q 'tutop-3a4f7' android/app/google-services.json; then
            echo "DETENIDO: google-services.json histórico detectado." >&2
            exit 2
          fi
          grep -q 'versionCode 90000' android/app/build.gradle
          grep -q 'versionName "0.9.0-beta.0"' android/app/build.gradle
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v6
      - name: Build staging debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean lintDebug testDebugUnitTest assembleDebug
      - name: Verify and stage artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" TuTop-0.9.0-beta.0-physical-qa-staging.apk
          sha256sum TuTop-0.9.0-beta.0-physical-qa-staging.apk | tee TuTop-0.9.0-beta.0-physical-qa-staging.apk.sha256
      - name: Upload beta APK
        uses: actions/upload-artifact@v7
        with:
          name: TuTop-0.9.0-beta.0-physical-qa-staging-${{ github.run_number }}
          path: |
            TuTop-0.9.0-beta.0-physical-qa-staging.apk
            TuTop-0.9.0-beta.0-physical-qa-staging.apk.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Publish durable Physical QA prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="tutop-0.9.0-beta.0-physical-qa-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            TuTop-0.9.0-beta.0-physical-qa-staging.apk \
            TuTop-0.9.0-beta.0-physical-qa-staging.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "TuTop 0.9.0 beta.0 Physical QA — build ${GITHUB_RUN_NUMBER}" \
            --notes "Physical QA staging candidate only. Not production-ready, not Play-ready. Built from ${GITHUB_SHA}." \
            --prerelease
      - name: Remove temporary Firebase configs
        if: always()
        run: rm -f .tutop-staging-web-config.json .tutop-staging-google-services.json android/app/google-services.json
