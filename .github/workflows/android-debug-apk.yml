name: Build TuTop 0.9.1 Android APK (zero cost)

on:
  workflow_dispatch:
    inputs:
      enable_reviews_lazy_cutover:
        description: 'Staging-only reviews lazy cutover'
        required: false
        default: false
        type: boolean
      enable_wallet_lazy_cutover:
        description: 'Staging-only wallet lazy cutover'
        required: false
        default: false
        type: boolean
      enable_favorites_visible_cutover:
        description: 'Staging-only favorites visible cutover'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tutop-091-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-v2-staging:
    name: TuTop 0.9.1 V2 physical QA staging APK
    if: github.ref_name == 'feat/tutop-0.9.1-nearby-topi'
    runs-on: [self-hosted, linux, x64, tutop-zero-cost-worker]
    timeout-minutes: 50
    permissions:
      contents: write
      actions: read
    env:
      TUTOP_FIREBASE_PROJECT_ID: tutop-beta-vicmdlb-1356585881
      TUTOP_STAGING_WEB_CONFIG_PATH: .tutop-staging-web-config.json
      TUTOP_ANDROID_GOOGLE_SERVICES_PATH: .tutop-staging-google-services.json
      TUTOP_ALLOW_ANDROID_APP_SETUP: staging-v2
      TUTOP_ANDROID_PACKAGE_NAME: mx.tutop.app
      TUTOP_BETA_VERSION: 0.9.1-beta.0
      TUTOP_ANDROID_VERSION_CODE: 90100
      TUTOP_APK_PATH: TuTop-0.9.1-beta.0-physical-qa-staging.apk
      TUTOP_APK_SHA256_PATH: TuTop-0.9.1-beta.0-physical-qa-staging.apk.sha256
      TUTOP_CANDIDATE_OUTPUT_PATH: PHYSICAL_QA_CANDIDATE_0.9.1.generated.json
      VITE_TUTOP_TOPI_REMOTE_ENABLED: "false"
      VITE_TUTOP_V2_REVIEWS_LAZY_CUTOVER: ${{ inputs.enable_reviews_lazy_cutover }}
      VITE_TUTOP_V2_WALLET_LAZY_CUTOVER: ${{ inputs.enable_wallet_lazy_cutover }}
      VITE_TUTOP_V2_FAVORITES_VISIBLE_CUTOVER: ${{ inputs.enable_favorites_visible_cutover }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      TUTOP_FIREBASE_OAUTH_CLIENT_ID: ${{ secrets.FIREBASE_OAUTH_CLIENT_ID }}
      TUTOP_FIREBASE_OAUTH_CLIENT_SECRET: ${{ secrets.FIREBASE_OAUTH_CLIENT_SECRET }}
    steps:
      - name: Checkout exact 0.9.1 feature ref
        uses: actions/checkout@v7

      - name: Require same-SHA green October and Staging
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/tutop-0.9.1-nearby-topi"
          GATE_RUN_ID="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/october-01-validation.yml/runs" \
            -f branch="$GITHUB_REF_NAME" -f head_sha="$GITHUB_SHA" -f status=success -f event=workflow_dispatch -f per_page=10 \
            --jq '.workflow_runs[0].id // empty')"
          test -n "$GATE_RUN_ID" || { echo "DETENIDO: falta October verde same-SHA ${GITHUB_SHA}." >&2; exit 43; }
          STAGING_RUN_ID="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/staging-v2-smoke.yml/runs" \
            -f branch="$GITHUB_REF_NAME" -f head_sha="$GITHUB_SHA" -f status=success -f event=workflow_dispatch -f per_page=10 \
            --jq '.workflow_runs[0].id // empty')"
          test -n "$STAGING_RUN_ID" || { echo "DETENIDO: falta Staging verde same-SHA ${GITHUB_SHA}." >&2; exit 44; }
          {
            echo "TUTOP_VALIDATED_GATE_RUN_ID=$GATE_RUN_ID"
            echo "TUTOP_VALIDATED_GATE_SHA=$GITHUB_SHA"
            echo "TUTOP_VALIDATED_STAGING_RUN_ID=$STAGING_RUN_ID"
            echo "TUTOP_VALIDATED_STAGING_SHA=$GITHUB_SHA"
          } >> "$GITHUB_ENV"
          echo "✅ 0.9.1 same-SHA chain: gate=${GATE_RUN_ID}, staging=${STAGING_RUN_ID}, sha=${GITHUB_SHA}."

      - name: Resolve Android Firebase credential mode
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_TOKEN:-}" ] && [ -n "${TUTOP_FIREBASE_OAUTH_CLIENT_ID:-}" ] && [ -n "${TUTOP_FIREBASE_OAUTH_CLIENT_SECRET:-}" ]; then
            echo "TUTOP_FIREBASE_AUTH_MODE=managed_refresh_token" >> "$GITHUB_ENV"
            exit 0
          fi
          if command -v gcloud >/dev/null 2>&1; then
            ACCESS_TOKEN="$(gcloud auth application-default print-access-token 2>/dev/null || true)"
            if [ -n "$ACCESS_TOKEN" ]; then
              echo "::add-mask::$ACCESS_TOKEN"
              {
                echo "TUTOP_FIREBASE_ACCESS_TOKEN=$ACCESS_TOKEN"
                echo "TUTOP_FIREBASE_AUTH_MODE=local_adc"
                echo "FIREBASE_TOKEN="
                echo "TUTOP_FIREBASE_OAUTH_CLIENT_ID="
                echo "TUTOP_FIREBASE_OAUTH_CLIENT_SECRET="
              } >> "$GITHUB_ENV"
              exit 0
            fi
          fi
          echo "DETENIDO: Android staging no tiene credencial Firebase utilizable." >&2
          exit 42

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Install web dependencies
        run: npm ci

      - name: Prepare staging Firebase Web config
        run: node scripts/prepare-staging-v2-auth.mjs

      - name: Prepare staging Firebase Android app config
        run: node scripts/prepare-staging-android-app.mjs

      - name: Export V2 staging build environment
        run: node scripts/export-staging-v2-build-env.mjs

      - name: Build V2 web bundle
        run: npm run build

      - name: Install Capacitor + native Firebase plugins
        run: npm run deps:mobile

      - name: Verify dependency manifests stayed immutable
        run: git diff --exit-code -- package.json package-lock.json

      - name: Generate Android project
        run: npm run android:bootstrap

      - name: Fix Android 0.9.1 beta version
        run: node scripts/configure-android-beta-version.mjs

      - name: Android doctor
        run: npm run android:doctor

      - name: Verify staging-only native config and version
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/google-services.json
          grep -q 'tutop-beta-vicmdlb-1356585881' android/app/google-services.json
          ! grep -q 'tutop-3a4f7' android/app/google-services.json
          grep -q 'versionCode 90100' android/app/build.gradle
          grep -q 'versionName "0.9.1-beta.0"' android/app/build.gradle

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v6

      - name: Build staging debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean lintDebug testDebugUnitTest assembleDebug

      - name: Verify and stage 0.9.1 artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "$TUTOP_APK_PATH"
          sha256sum "$TUTOP_APK_PATH" | tee "$TUTOP_APK_SHA256_PATH"
          cat > TuTop-0.9.1-beta.0-physical-qa-staging.metadata.txt <<EOF
          head_sha=${GITHUB_SHA}
          gate_run_id=${TUTOP_VALIDATED_GATE_RUN_ID}
          gate_head_sha=${TUTOP_VALIDATED_GATE_SHA}
          staging_smoke_run_id=${TUTOP_VALIDATED_STAGING_RUN_ID}
          staging_smoke_head_sha=${TUTOP_VALIDATED_STAGING_SHA}
          firebase_project=${TUTOP_FIREBASE_PROJECT_ID}
          version=${TUTOP_BETA_VERSION}
          version_code=${TUTOP_ANDROID_VERSION_CODE}
          reviews_lazy_cutover=${VITE_TUTOP_V2_REVIEWS_LAZY_CUTOVER}
          wallet_lazy_cutover=${VITE_TUTOP_V2_WALLET_LAZY_CUTOVER}
          favorites_visible_cutover=${VITE_TUTOP_V2_FAVORITES_VISIBLE_CUTOVER}
          EOF

      - name: Upload 0.9.1 beta APK
        id: upload-staging
        uses: actions/upload-artifact@v7
        with:
          name: TuTop-0.9.1-beta.0-physical-qa-staging-${{ github.run_number }}
          path: |
            TuTop-0.9.1-beta.0-physical-qa-staging.apk
            TuTop-0.9.1-beta.0-physical-qa-staging.apk.sha256
            TuTop-0.9.1-beta.0-physical-qa-staging.metadata.txt
          if-no-files-found: error
          retention-days: 90

      - name: Generate and verify independent 0.9.1 candidate manifest
        env:
          TUTOP_UPLOAD_ARTIFACT_ID: ${{ steps.upload-staging.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          APK_SHA256="$(cut -d ' ' -f1 "$TUTOP_APK_SHA256_PATH")"
          APK_SIZE="$(wc -c < "$TUTOP_APK_PATH" | tr -d ' ')"
          {
            echo "artifact_id=${TUTOP_UPLOAD_ARTIFACT_ID}"
            echo "build_run_id=${GITHUB_RUN_ID}"
            echo "build_run_number=${GITHUB_RUN_NUMBER}"
            echo "build_tree_sha=${BUILD_TREE_SHA}"
            echo "apk_sha256=${APK_SHA256}"
            echo "apk_size_bytes=${APK_SIZE}"
          } >> TuTop-0.9.1-beta.0-physical-qa-staging.metadata.txt
          node scripts/generate-physical-qa-candidate.mjs
          node scripts/verify-generated-physical-qa-candidate.mjs "$TUTOP_CANDIDATE_OUTPUT_PATH" TuTop-0.9.1-beta.0-physical-qa-staging.metadata.txt

      - name: Upload 0.9.1 candidate evidence
        uses: actions/upload-artifact@v7
        with:
          name: TuTop-0.9.1-beta.0-physical-qa-candidate-${{ github.run_number }}
          path: |
            PHYSICAL_QA_CANDIDATE_0.9.1.generated.json
            TuTop-0.9.1-beta.0-physical-qa-staging.metadata.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish durable 0.9.1 Physical QA prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="tutop-0.9.1-beta.0-physical-qa-${GITHUB_RUN_NUMBER}"
          TITLE="TuTop 0.9.1 beta.0 Physical QA — build ${GITHUB_RUN_NUMBER}"
          NOTES="0.9.1 staging candidate only. Not production-ready or Play-ready. Exact SHA=${GITHUB_SHA}; artifact=${{ steps.upload-staging.outputs.artifact-id }}; gate=${TUTOP_VALIDATED_GATE_RUN_ID}; staging=${TUTOP_VALIDATED_STAGING_RUN_ID}."

          publish_prerelease() {
            if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "$TITLE" \
                --notes "$NOTES" \
                --prerelease || return 1
            fi

            gh release upload "$TAG" \
              TuTop-0.9.1-beta.0-physical-qa-staging.apk \
              TuTop-0.9.1-beta.0-physical-qa-staging.apk.sha256 \
              TuTop-0.9.1-beta.0-physical-qa-staging.metadata.txt \
              PHYSICAL_QA_CANDIDATE_0.9.1.generated.json \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          }

          for attempt in 1 2 3 4 5; do
            if publish_prerelease; then
              echo "✅ Physical QA prerelease durable publicado: ${TAG}."
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 10))
              echo "GitHub Releases temporalmente no disponible (intento ${attempt}/5); reintento en ${delay}s." >&2
              sleep "$delay"
            fi
          done

          echo "DETENIDO: GitHub Releases siguió fallando después de 5 intentos; APK y artifacts permanecen preservados." >&2
          exit 1

      - name: Remove temporary Firebase configs
        if: always()
        run: rm -f .tutop-staging-web-config.json .tutop-staging-google-services.json android/app/google-services.json
