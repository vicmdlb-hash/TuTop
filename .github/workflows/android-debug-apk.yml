name: Build TuTop Android APK (zero cost)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tutop-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firestore-rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install web dependencies
        run: npm ci
      - name: Install emulator test dependencies (ephemeral)
        run: npm install --no-save firebase@latest @firebase/rules-unit-testing@latest firebase-tools@latest
      - name: Execute Firestore rules tests
        run: npx firebase emulators:exec --project demo-tutop-rules-test --only firestore "node --test tests/firestore.rules.test.mjs"

  android-debug-apk:
    name: TuTop debug APK
    needs: firestore-rules
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm ci

      - name: Static checks
        run: npm run check

      - name: GitHub readiness gate
        run: npm run github:ready

      - name: Beta readiness gate
        run: npm run beta:ready

      - name: Typecheck
        run: npm run typecheck

      - name: Build web app
        run: npm run build

      - name: Install Capacitor Android stack
        run: npm run deps:mobile

      - name: Generate Android project
        run: npm run android:bootstrap

      - name: Android doctor
        run: npm run android:doctor

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean lintDebug testDebugUnitTest assembleDebug

      - name: Verify APK and checksum
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee TuTop-debug.apk.sha256
          cp "$APK" TuTop-debug.apk
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload TuTop APK
        uses: actions/upload-artifact@v4
        with:
          name: TuTop-Android-debug-${{ github.run_number }}
          path: |
            TuTop-debug.apk
            TuTop-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
