name: Build116 exact publication live proof — no APK

on:
  push:
    branches: [probe/build116-exact-publication-after-rate-read]

permissions:
  contents: read

concurrency:
  group: build116-exact-publication-live-proof
  cancel-in-progress: true

jobs:
  exact-client-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TUTOP_FIREBASE_PROJECT_ID: tutop-beta-vicmdlb-1356585881
      TUTOP_BUILD116_EXACT_ACK: BUILD116_EXACT_PUBLICATION_AFTER_RATE_READ
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      TUTOP_FIREBASE_OAUTH_CLIENT_ID: ${{ secrets.TUTOP_FIREBASE_OAUTH_CLIENT_ID }}
      TUTOP_FIREBASE_OAUTH_CLIENT_SECRET: ${{ secrets.TUTOP_FIREBASE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Assert probe branch still contains exact build116 production sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 8a4368ba0fce34d0a87acc8eccf38bf5dc019bc2:src/services/rateLimit.ts)" = "$(git rev-parse HEAD:src/services/rateLimit.ts)"
          test "$(git rev-parse 8a4368ba0fce34d0a87acc8eccf38bf5dc019bc2:src/services/firebaseRest.ts)" = "$(git rev-parse HEAD:src/services/firebaseRest.ts)"
          test "$(git rev-parse 8a4368ba0fce34d0a87acc8eccf38bf5dc019bc2:src/services/canonicalListingsBackend.ts)" = "$(git rev-parse HEAD:src/services/canonicalListingsBackend.ts)"
          echo "PASS production sources exactly match build116 SHA"
      - name: Prove exact build116 screen-to-backend publication delegation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const screen=fs.readFileSync('src/components/NationalPublishScreen.tsx','utf8');
          const bridge=fs.readFileSync('src/services/nationalIdentityHydrationBridge.ts','utf8');
          const backend=fs.readFileSync('src/services/canonicalListingsBackend.ts','utf8');
          const rate=fs.readFileSync('src/services/rateLimit.ts','utf8');

          function must(text,re,label){
            if(!re.test(text)) throw new Error('DELEGATION_DRIFT:'+label);
          }

          must(screen,/verifiedEmailBetaAuth\.refreshVerificationStatus\(\)/,'screen refreshes verification');
          must(screen,/if \(!verification\.emailVerified\)/,'screen blocks unverified account');
          must(screen,/await canonicalListingsBackend\.create\(listing, category\)/,'screen delegates canonical create');

          must(bridge,/const originalCreateListing = canonicalListingsBackend\.create\.bind\(canonicalListingsBackend\)/,'bridge captures canonical create');
          must(bridge,/canonicalListingsBackend\.create = async \(listing, category\) =>/,'bridge wraps canonical create');
          must(bridge,/validateResolvedIdentityInFirestore\(firebase, selected\)/,'bridge validates live catalog');
          must(bridge,/await migrateLegacyIdentity\(firebase, uid, profile\.data, resolved\)/,'bridge reconciles profile when needed');
          must(bridge,/return originalCreateListing\(\{/,'bridge returns to canonical authority');

          must(backend,/validateCanonicalListingPolicy\(listing, category\)/,'canonical policy runs');
          must(backend,/await commitWithRateLimit\(client, 'listing_create'/,'canonical create consumes listing rate bucket');
          must(backend,/client\.encodeDocumentForWrite\(`listings_v2\/\$\{id\}`/,'canonical create serializes listings_v2');

          must(rate,/client\.getDocument(?:<[^>]+>)?\(path\)/,'rate path reads deterministic bucket');
          must(rate,/if \(!existing\)/,'missing bucket has create branch');
          must(rate,/currentDocument: \{ exists: false \}/,'first bucket uses create precondition');

          console.log('PASS exact build116 delegation: screen -> verification -> identity bridge -> canonical create -> rate-limited atomic listing write');
          NODE
      - name: Read exact existing staging client config — no deploy
        run: node scripts/read-existing-staging-build-config.mjs
      - name: Execute exact build116 rate-limit and publication path
        run: node --experimental-strip-types --experimental-loader ./scripts/node-ts-extension-loader.mjs scripts/build116-exact-publication-live-proof.mjs
      - name: No dependency drift
        run: git diff --exit-code -- package.json package-lock.json
      - name: Prove no Android candidate work exists
        shell: bash
        run: |
          set -euo pipefail
          test ! -d android/app/build/outputs/apk || test -z "$(find android/app/build/outputs/apk -type f -name '*.apk' -print -quit 2>/dev/null)"
          echo "PASS no APK generated"
