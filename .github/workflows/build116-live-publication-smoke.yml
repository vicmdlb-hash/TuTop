name: Build116 live verified publication smoke

on:
  push:
    branches: [probe/build116-publication-live-smoke]

permissions:
  contents: read

concurrency:
  group: build116-live-publication-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TUTOP_FIREBASE_PROJECT_ID: tutop-beta-vicmdlb-1356585881
      TUTOP_PUBLICATION_SMOKE_ACK: BUILD116_P0_SYNTHETIC_PUBLICATION_ONLY
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      TUTOP_FIREBASE_OAUTH_CLIENT_ID: ${{ secrets.TUTOP_FIREBASE_OAUTH_CLIENT_ID }}
      TUTOP_FIREBASE_OAUTH_CLIENT_SECRET: ${{ secrets.TUTOP_FIREBASE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Read exact existing staging client config — no deploy
        run: node scripts/read-existing-staging-build-config.mjs
      - name: Verified-email public publication smoke with mandatory cleanup
        run: node scripts/build116-live-publication-smoke.mjs
      - name: No dependency drift
        run: git diff --exit-code -- package.json package-lock.json
