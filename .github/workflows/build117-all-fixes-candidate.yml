name: TuTop build117 all-fixes candidate

on:
  push:
    branches: [candidate/tutop-117-all-fixes]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tutop-build117-all-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    if: github.ref_name == 'candidate/tutop-117-all-fixes' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TUTOP_FIREBASE_PROJECT_ID: tutop-beta-vicmdlb-1356585881
      TUTOP_BETA_VERSION: 0.9.2-beta.7
      TUTOP_ANDROID_VERSION_CODE: 90211
      TUTOP_AI_APP_CHECK_REQUIRED: 'false'
      VITE_TUTOP_TOPI_REMOTE_ENABLED: 'false'
      TUTOP_CLIENT_EQUIVALENT_ACK: POST116_CLIENT_EQUIVALENT_PUBLICATION_ONLY
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      TUTOP_FIREBASE_OAUTH_CLIENT_ID: ${{ secrets.TUTOP_FIREBASE_OAUTH_CLIENT_ID }}
      TUTOP_FIREBASE_OAUTH_CLIENT_SECRET: ${{ secrets.TUTOP_FIREBASE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci

      - name: Full existing regression
        run: npm run check
      - name: Build116 physical-feedback regressions retained
        run: |
          node scripts/build116-deviceA-feedback-tests.mjs
          node scripts/build111-physical-feedback-tests.mjs
      - name: Publication root-cause and retry contracts
        run: |
          node scripts/post116-publication-client-contract-tests.mjs
          node scripts/post116-rate-window-runtime-tests.mjs
          node scripts/post116-publish-idempotency-tests.mjs
      - name: Durable draft privacy and Topi contracts
        run: |
          node --experimental-strip-types scripts/post116-durable-publish-draft-tests.mjs
          node --experimental-strip-types scripts/post116-pr84-privacy-integration-tests.mjs
          node --experimental-strip-types scripts/post116-pr85-topi-structured-tests.mjs
      - name: Erasure truth contracts
        run: |
          node scripts/firestore-query-pagination-tests.mjs
          node scripts/post116-erasure-completion-attestation-tests.mjs
          node scripts/account-erasure-tests.mjs
          node --experimental-strip-types scripts/post116-erasure-user-status-truth-tests.mjs
          node scripts/legal-retention-review-tests.mjs
      - name: Push and account isolation contracts
        run: |
          node scripts/post116-push-health-contract-tests.mjs
          node scripts/post116-push-ownership-contract-tests.mjs
          node scripts/post116-push-account-isolation-tests.mjs
          node --experimental-strip-types scripts/post116-account-personalization-isolation-tests.mjs
      - name: Moderation privacy and race contracts
        run: |
          node scripts/post116-pr88-moderation-privacy-integration-tests.mjs
          node scripts/post116-seller-moderation-truth-tests.mjs
          node scripts/post116-nearby-moderation-freshness-tests.mjs
          node scripts/post116-listing-moderation-race-tests.mjs
      - name: Compose strict V2 Rules before reservation contracts
        run: npm run v2:rules:prepare
      - name: Reservation truth contracts
        run: |
          node scripts/post116-reservation-availability-tests.mjs
          node scripts/post116-counteroffer-atomic-reservation-tests.mjs
      - name: Network and accessibility contracts
        run: |
          node scripts/post116-firebase-request-timeout-tests.mjs
          node scripts/post116-accessibility-semantics-tests.mjs
      - name: CI historical-candidate hygiene contract
        run: node scripts/post116-ci-candidate-trigger-hygiene-tests.mjs
      - name: Exact typecheck and core contracts
        run: |
          npm run typecheck
          node scripts/verified-email-beta-contract-tests.mjs
          node scripts/marketplace-notification-projection-tests.mjs
          node scripts/v2-canonical-bridge-coverage-tests.mjs
          node scripts/v2-rules-composition-contract-tests.mjs

      - name: Emulator dependencies
        run: npm install --no-save --package-lock=false --no-audit --no-fund firebase@12.18.0 @firebase/rules-unit-testing@5.0.2 firebase-tools@15.30.1
      - name: Reservation lock emulator
        run: npx firebase emulators:exec --only firestore --project demo-tutop-build117-reservation --config firebase.v2.json "node --test --test-concurrency=1 tests/firestore.v2.transaction-lock.test.mjs"
      - name: Governance least-privilege account and publication emulator
        run: >
          npx firebase emulators:exec --only firestore
          --project demo-tutop-build117
          --config firebase.v2.json
          "node --test --test-concurrency=1
          tests/firestore.v2.governance.test.mjs
          tests/firestore.v2.private-admin-reads.test.mjs
          tests/firestore.v2.account-operations.test.mjs
          tests/firestore.verified-email.test.mjs
          tests/firestore.v2.post106-verified-identity.test.mjs
          tests/firestore.v2.runtime-services.test.mjs
          tests/firestore.v2.favorite-membership.test.mjs
          tests/firestore.v2.notification-receipts.test.mjs
          tests/firestore.v2.reputation-trust.test.mjs
          tests/firestore.v2.review-strike-aggregation.test.mjs
          tests/firestore.v2.unread-aggregation.test.mjs"

      - name: Read existing staging configuration without mutations
        run: node scripts/read-existing-staging-build-config.mjs
      - name: Candidate117 client-equivalent publication against staging
        run: node --experimental-strip-types --experimental-loader ./scripts/node-ts-extension-loader.mjs scripts/post116-client-equivalent-live-smoke.mjs
      - name: Prove Firebase AI runtime on staging
        run: node scripts/staging-topi-ai-runtime-smoke.mjs

      - name: Export exact staging build environment
        run: node scripts/export-staging-v2-build-env.mjs
      - name: Production web build
        run: npm run build
      - name: Mobile dependency lock
        run: npm run deps:mobile
      - name: No package dependency drift
        run: git diff --exit-code -- package.json package-lock.json
      - name: Android bootstrap
        run: npm run android:bootstrap
      - name: Fix build117 Android version
        run: node scripts/configure-android-beta-version.mjs
      - name: Android doctor
        run: npm run android:doctor
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Android lint unit and APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug
      - name: Inspect exact APK branding geometry and bundled auth UX
        run: node scripts/build115-apk-branding-artifact-tests.mjs android/app/build/outputs/apk/debug/app-debug.apk
      - name: Exact build117 candidate provenance
        run: node scripts/package-build117-candidate.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: TuTop-build117-${{ github.sha }}
          path: engineering-candidate/
          retention-days: 30
          if-no-files-found: error
