# RETIRED: obsolete Build115/116/118/120 candidate. Audit source only; do not execute.
name: RETIRED — Build118 staging native Firebase key repair — exact APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tutop-build118-staging-native-key-repair
  cancel-in-progress: false

jobs:
  repair:
    # Historical candidate retained for audit only. Hard-disabled.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TUTOP_FIREBASE_PROJECT_ID: tutop-beta-vicmdlb-1356585881
      TUTOP_STAGING_NATIVE_KEY_REPAIR_ACK: BUILD118_EXACT_APK_CERT
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      TUTOP_FIREBASE_OAUTH_CLIENT_ID: ${{ secrets.TUTOP_FIREBASE_OAUTH_CLIENT_ID }}
      TUTOP_FIREBASE_OAUTH_CLIENT_SECRET: ${{ secrets.TUTOP_FIREBASE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Exact staging-only guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/build118-deviceA-physical-failures"
          grep -q "BUILD118_SOURCE='e93ca0bb237e7fa438df5801fc627f065d9441e6'" scripts/repair-build118-staging-native-api-key.mjs
          grep -q "BUILD118_APK_SHA256='6fadbdb05d6d3b2386eeffc3e2885e9f406190ed9710914048bd1a14a69ac8f7'" scripts/repair-build118-staging-native-api-key.mjs
          grep -q "PACKAGE='mx.tutop.app'" scripts/repair-build118-staging-native-api-key.mjs
      - name: Fresh-read + minimal API-key restriction repair + read-back
        run: node scripts/repair-build118-staging-native-api-key.mjs
      - name: Prove no APK AAB deploy billing
        shell: bash
        run: |
          set -euo pipefail
          test -s staging-readiness/build118-native-key-repair.json
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('staging-readiness/build118-native-key-repair.json','utf8'));
          if(e.status!=='PASS'||e.exact_build118_app_allowed!==true||e.spend!==0||e.production!==false)process.exit(2);
          if(e.api_targets_preserved!==true)process.exit(3);
          console.log('PASS staging-only restriction repair verified');
          NODE
          test ! -d android/app/build/outputs || test -z "$(find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit 2>/dev/null)"
          echo "PASS no APK/AAB/deploy/billing"
