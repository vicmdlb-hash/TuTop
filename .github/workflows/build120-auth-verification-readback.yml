name: Build120 Auth verification readback — no mutation

on:
  push:
    branches: [ops/build120-auth-verification-readback]

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TUTOP_FIREBASE_PROJECT_ID: tutop-beta-vicmdlb-1356585881
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      TUTOP_FIREBASE_OAUTH_CLIENT_ID: ${{ secrets.TUTOP_FIREBASE_OAUTH_CLIENT_ID }}
      TUTOP_FIREBASE_OAUTH_CLIENT_SECRET: ${{ secrets.TUTOP_FIREBASE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Prepare exact final V2 Rules
        run: npm run v2:rules:prepare
      - name: Install ephemeral Rules test harness
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund @firebase/rules-unit-testing@5.0.2 firebase@12.18.0
          git diff --exit-code -- package.json package-lock.json
      - name: Prove current email-registration private document is rejected
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --only firestore
          --config firebase.v2.json
          --project demo-tutop-email-registration-rule
          "node --test tests/firestore.v2.email-registration-current-fail.test.mjs"
      - name: Auth/API-key verification readback — sanitized no mutation
        run: node scripts/build120-auth-verification-readback.mjs
      - name: Prove no deploy/build artifact
        shell: bash
        run: |
          set -euo pipefail
          test ! -d android/app/build/outputs || test -z "$(find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit 2>/dev/null)"
          echo "PASS read-only Auth/API-key inspection; no deploy/APK/AAB"
