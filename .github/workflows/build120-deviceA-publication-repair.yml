# RETIRED: obsolete Build115/116/118/120 candidate. Audit source only; do not execute.
name: RETIRED — TuTop Build120 Device A + publication repairs — staging APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tutop-build120-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    # Historical candidate retained for audit only. Hard-disabled.
    if: ${{ false }}
    if: github.ref_name == 'candidate/tutop-120-deviceA-publication-repair' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TUTOP_FIREBASE_PROJECT_ID: tutop-beta-vicmdlb-1356585881
      TUTOP_BETA_VERSION: 0.9.2-beta.10
      TUTOP_ANDROID_VERSION_CODE: 90214
      TUTOP_AI_APP_CHECK_REQUIRED: 'false'
      VITE_TUTOP_TOPI_REMOTE_ENABLED: 'false'
      TUTOP_BUILD120_NATIVE_KEY_ACK: BUILD120_EXACT_APK_CERT
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      TUTOP_FIREBASE_OAUTH_CLIENT_ID: ${{ secrets.TUTOP_FIREBASE_OAUTH_CLIENT_ID }}
      TUTOP_FIREBASE_OAUTH_CLIENT_SECRET: ${{ secrets.TUTOP_FIREBASE_OAUTH_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Full existing regression
        run: npm run check

      - name: Build120 causal repair gates
        run: |
          node scripts/build119-deviceA-repair-integration-tests.mjs
          node scripts/build118-deviceA-product-detail-hook-order-tests.mjs
          node scripts/build118-deviceA-native-failure-diagnostics-tests.mjs
          node scripts/post116-push-health-contract-tests.mjs
          node scripts/build119-national-scope-publication-tests.mjs
          node scripts/listing-schema-v2-tests.mjs
          node scripts/local-topi-favorites-tests.mjs
          node scripts/device-ux-ai-092-contract-tests.mjs

      - name: Publication reservation moderation and account regressions
        run: |
          node --experimental-strip-types scripts/build118-publication-recovery-tests.mjs
          node scripts/post116-publication-client-contract-tests.mjs
          node --experimental-strip-types scripts/post116-durable-publish-draft-tests.mjs
          node scripts/post116-publish-idempotency-tests.mjs
          node scripts/post116-reservation-availability-tests.mjs
          node scripts/post116-nearby-moderation-freshness-tests.mjs
          node --experimental-strip-types scripts/post116-account-personalization-isolation-tests.mjs

      - name: Prepare exact strict V2 Rules
        run: npm run v2:rules:prepare

      - name: Install ephemeral Firestore emulator harness
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund @firebase/rules-unit-testing@5.0.2 firebase@12.18.0
          git diff --exit-code -- package.json package-lock.json

      - name: Firestore canonical publication and relevant security regression
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --only firestore
          --config firebase.v2.json
          --project demo-tutop-build120
          "node --test --test-concurrency=1
          tests/firestore.v2.rules.test.mjs
          tests/firestore.v2.atomic.test.mjs
          tests/firestore.v2.acceptance-atomic.test.mjs
          tests/firestore.v2.reputation-trust.test.mjs
          tests/firestore.v2.governance.test.mjs
          tests/firestore.v2.runtime-services.test.mjs
          tests/firestore.v2.account-operations.test.mjs
          tests/firestore.v2.notification-receipts.test.mjs
          tests/firestore.v2.transaction-lock.test.mjs
          tests/firestore.v2.unread-aggregation.test.mjs
          tests/firestore.v2.review-strike-aggregation.test.mjs
          tests/firestore.v2.favorite-membership.test.mjs"

      - name: Live staging Rules semantic read-back — no deploy
        run: node scripts/build120-staging-rules-readback.mjs

      - name: Exact typecheck
        run: npm run typecheck

      - name: Read current staging Firebase config
        run: node scripts/read-existing-staging-build-config.mjs

      - name: Export exact Build120 staging environment
        run: node scripts/export-staging-v2-build-env.mjs

      - name: Install mobile dependencies
        run: |
          npm run deps:mobile
          git diff --exit-code -- package.json package-lock.json

      - name: Firebase AI live runtime smoke
        run: node scripts/staging-topi-ai-runtime-smoke.mjs

      - name: Production-mode web build
        run: npm run build

      - name: Android bootstrap and exact beta version
        run: |
          npm run android:bootstrap
          node scripts/configure-android-beta-version.mjs
          npm run android:doctor

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Android lint unit and APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Bind exact Build120 APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          APKSIGNER_OUT="$("$APKSIGNER" verify --print-certs "$APK")"
          CERT_SHA1=""
          while IFS= read -r line; do
            if [[ "$line" == *"SHA-1"* ]]; then
              CERT_SHA1="${line##* }"
              CERT_SHA1="${CERT_SHA1//:/}"
              CERT_SHA1="${CERT_SHA1^^}"
              break
            fi
          done <<< "$APKSIGNER_OUT"
          if [[ ! "$CERT_SHA1" =~ ^[0-9A-F]{40}$ ]]; then
            echo "Could not extract a 40-hex SHA-1 fingerprint from apksigner output." >&2
            exit 3
          fi
          echo "TUTOP_BUILD120_APK_SHA256=$APK_SHA" >> "$GITHUB_ENV"
          echo "TUTOP_BUILD120_CERT_SHA1=$CERT_SHA1" >> "$GITHUB_ENV"
          echo "Build120 APK identity captured without exposing Firebase credentials."

      - name: Exact Build120 staging Firebase key binding and read-back
        run: node scripts/repair-build120-staging-native-api-key.mjs

      - name: Inspect exact APK branding and bundled auth UX
        run: node scripts/build115-apk-branding-artifact-tests.mjs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Package exact Build120 provenance
        run: node scripts/package-build120-candidate.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: TuTop-build120-${{ github.sha }}
          path: engineering-candidate/
          retention-days: 30
          if-no-files-found: error
