name: Build120 moderation/admin aggregate readback
on:
  push:
    branches: [ops/build120-moderation-readback]
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TUTOP_FIREBASE_PROJECT_ID: tutop-beta-vicmdlb-1356585881
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      TUTOP_FIREBASE_OAUTH_CLIENT_ID: ${{ secrets.TUTOP_FIREBASE_OAUTH_CLIENT_ID }}
      TUTOP_FIREBASE_OAUTH_CLIENT_SECRET: ${{ secrets.TUTOP_FIREBASE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Aggregate-only staging readback
        run: node scripts/build120-moderation-aggregate-readback.mjs
      - name: Prove read-only
        run: echo "PASS no deploy/no mutation/no APK/AAB"
