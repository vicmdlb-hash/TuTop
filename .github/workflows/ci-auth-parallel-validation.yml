name: TuTop CI auth parallel validation

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  legacy-readiness:
    name: Legacy Firebase token readiness
    runs-on: ubuntu-latest
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      TUTOP_FIREBASE_PROJECT_ID: tutop-beta-vicmdlb-1356585881
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate current fallback remains usable
        run: node scripts/ci-auth-readiness.mjs

  github-oidc-producer:
    name: GitHub OIDC producer readiness
    runs-on: ubuntu-latest
    steps:
      - name: Mint short-lived GitHub OIDC assertion only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          RESPONSE="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tutop-staging-wif")"
          TOKEN="$(node -e 'const j=JSON.parse(process.argv[1]); if(!j.value)process.exit(2); process.stdout.write(j.value)' "$RESPONSE")"
          echo "::add-mask::$TOKEN"
          PARTS="$(node -e 'const t=process.argv[1].split("."); if(t.length!==3)process.exit(2); console.log(t.length)' "$TOKEN")"
          test "$PARTS" = "3"
          echo "GitHub OIDC producer: PASS (assertion not persisted or exchanged)"

  wif-config-readiness:
    name: Google WIF config readiness
    runs-on: ubuntu-latest
    env:
      WIF_PROVIDER: ${{ vars.TUTOP_WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ vars.TUTOP_WIF_SERVICE_ACCOUNT }}
    steps:
      - name: Report external configuration status without changing auth
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${WIF_PROVIDER:-}" ] && [ -n "${WIF_SERVICE_ACCOUNT:-}" ]; then
            echo "WIF metadata present: READY_FOR_EXCHANGE_VALIDATION"
          else
            echo "WIF metadata absent: BLOCKED_EXTERNAL_SETUP"
          fi
          echo "This workflow never removes FIREBASE_TOKEN and never switches production auth."
