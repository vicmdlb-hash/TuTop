# Physical QA fixes rerun: feed overlays, evidence reputation, assisted publish and identity resync.
name: One-shot TuTop 0.8.5 hardened APK validation

on:
  push:
    branches: ["feat/tutop-0.8-p0"]
    paths:
      - ".github/workflows/one-shot-085-hardened.yml"

permissions:
  contents: read

jobs:
  hardened-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TUTOP_FIREBASE_PROJECT_ID: tutop-beta-vicmdlb-1356585881
      TUTOP_STAGING_WEB_CONFIG_PATH: .tutop-staging-web-config.json
      TUTOP_ANDROID_GOOGLE_SERVICES_PATH: .tutop-staging-google-services.json
      TUTOP_ALLOW_ANDROID_APP_SETUP: staging-v2
      TUTOP_ANDROID_PACKAGE_NAME: mx.tutop.app
      TUTOP_BETA_VERSION: 0.8.5-beta.0
      TUTOP_ANDROID_VERSION_CODE: 80500
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout hardened feature branch
        uses: actions/checkout@v7

      - name: Guard staging only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/tutop-0.8-p0"
          test "$TUTOP_FIREBASE_PROJECT_ID" = "tutop-beta-vicmdlb-1356585881"
          test "$TUTOP_FIREBASE_PROJECT_ID" != "tutop-3a4f7"
          test -n "$FIREBASE_TOKEN"

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Install locked web dependencies
        run: npm ci

      - name: Verify clean dependency audit
        run: npm audit --audit-level=moderate

      - name: Full beta and security gates
        run: |
          npm run check
          npm run github:ready
          npm run beta:ready
          npm run v2:staging:readiness:test
          npm run v2:rules:prepare
          npm run native-security:test
          npm run typecheck

      - name: Prepare isolated staging Firebase configs
        run: |
          node scripts/prepare-staging-v2-auth.mjs
          node scripts/prepare-staging-android-app.mjs
          node scripts/export-staging-v2-build-env.mjs

      - name: Build optimized V2 web bundle
        run: npm run build

      - name: Install pinned mobile stack ephemerally
        run: npm run deps:mobile

      - name: Verify dependency manifests stayed immutable
        run: git diff --exit-code -- package.json package-lock.json

      - name: Generate native Android project
        run: npm run android:bootstrap

      - name: Force beta version and harden generated JNI packaging
        run: npm run android:version

      - name: Android doctor
        run: npm run android:doctor

      - name: Confirm staging Firebase and no historical project
        shell: bash
        run: |
          set -euo pipefail
          grep -R 'tutop-beta-vicmdlb-1356585881' android/app/google-services.json >/dev/null
          if grep -R 'tutop-3a4f7' android/app/google-services.json android/app/src/main/res android/app/src/main/assets 2>/dev/null; then
            echo 'DETENIDO: Firebase histórico apareció dentro del Android V2.' >&2
            exit 51
          fi

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v6

      - name: Android lint unit tests and assemble
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean lintDebug testDebugUnitTest assembleDebug

      - name: Verify beta APK metadata checksum and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" release/TuTop-0.8.5-beta.0-hardened-staging.apk
          sha256sum release/TuTop-0.8.5-beta.0-hardened-staging.apk | tee release/TuTop-0.8.5-beta.0-hardened-staging.apk.sha256
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "versionCode='80500' versionName='0.8.5-beta.0'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload hardened beta APK
        uses: actions/upload-artifact@v7
        with:
          name: TuTop-0.8.5-beta.0-hardened-staging-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          retention-days: 14
