name: One-shot TuTop 0.9 physical QA migration

on:
  push:
    branches: ["feat/tutop-0.8-p0"]
    paths:
      - ".github/workflows/one-shot-09-physical-qa.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/tutop-0.8-p0
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Guard feature branch
        run: |
          test "$GITHUB_REF_NAME" = "feat/tutop-0.8-p0"
          test "$(git branch --show-current)" = "feat/tutop-0.8-p0"
      - name: Apply 0.9 migration
        run: node scripts/prepare-physical-qa-09.mjs
      - name: Validate web and policy gates
        run: |
          npm ci
          npm run check
          npm run beta:ready
          npm run typecheck
          npm run build
      - name: Commit 0.9 migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json config/project.json scripts/beta-ready.mjs scripts/configure-android-beta-version.mjs scripts/install-mobile-deps.mjs src/services/nativeFirebaseSecurity.ts scripts/physical-qa-regression-tests.mjs
          git commit -m "feat: enter TuTop 0.9 Android physical QA"
          git push origin HEAD:feat/tutop-0.8-p0
