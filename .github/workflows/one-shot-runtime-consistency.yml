name: One-shot apply TuTop runtime consistency fixes

on:
  push:
    branches: ["feat/tutop-0.8-p0"]
    paths:
      - ".github/workflows/one-shot-runtime-consistency.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/tutop-0.8-p0
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Guard feature branch
        run: |
          test "$GITHUB_REF_NAME" = "feat/tutop-0.8-p0"
          test "$(git branch --show-current)" = "feat/tutop-0.8-p0"
      - name: Apply codemod
        run: node scripts/apply-runtime-consistency-fixes.mjs
      - name: Validate
        run: |
          npm ci
          npm run check
          npm run typecheck
          npm run build
      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/BackendGate.tsx src/components/NationalPublishScreen.tsx
          git commit -m "fix: stabilize V2 onboarding and shipping state"
          git push origin HEAD:feat/tutop-0.8-p0
