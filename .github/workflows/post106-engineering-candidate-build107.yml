name: TuTop post106 engineering candidate build107

on:
  push:
    branches:
      - feat/tutop-post106-security-fcm
    paths:
      - .github/workflows/post106-engineering-candidate-build107.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tutop-post106-engineering-build107-${{ github.ref }}
  cancel-in-progress: false

env:
  TUTOP_FIREBASE_PROJECT_ID: tutop-beta-vicmdlb-1356585881
  TUTOP_BETA_VERSION: 0.9.2-beta.0
  TUTOP_ANDROID_VERSION_CODE: 90201
  TUTOP_ANDROID_PACKAGE_NAME: mx.tutop.app
  TUTOP_ANDROID_GOOGLE_SERVICES_PATH: .tutop-staging-google-services.json
  TUTOP_APK_PATH: TuTop-0.9.2-beta.0-engineering-build107.apk
  TUTOP_APK_SHA256_PATH: TuTop-0.9.2-beta.0-engineering-build107.apk.sha256
  TUTOP_BUILD106_RUN_ID: '35048851909'
  TUTOP_BUILD106_ARTIFACT: TuTop-0.9.2-beta.0-physical-qa-staging-106
  TUTOP_BUILD106_SHA: b54b03cb01d1b3ec42dd1458ad3e1bb3bd22043c
  TUTOP_BUILD106_APK_SHA256: a75376a20f7aa2aedf881484ab59b0cb96f5603c485e9054b1408392eac4b41d
  VITE_TUTOP_SCHEMA_V2: 'true'
  VITE_TUTOP_ENVIRONMENT: staging
  VITE_TUTOP_APP_VERSION: 0.9.2-beta.0
  VITE_TUTOP_TOPI_FIREBASE_AI_ENABLED: 'true'
  VITE_TUTOP_TOPI_MODEL: gemini-3.8-flash
  VITE_TUTOP_AI_APP_CHECK_REQUIRED: 'false'
  VITE_TUTOP_TOPI_REMOTE_ENABLED: 'false'
  VITE_TUTOP_MEDIA_STORAGE_ENABLED: 'false'
  VITE_TUTOP_V2_REVIEWS_LAZY_CUTOVER: 'false'
  VITE_TUTOP_V2_WALLET_LAZY_CUTOVER: 'false'
  VITE_TUTOP_V2_FAVORITES_VISIBLE_CUTOVER: 'false'

jobs:
  build107:
    name: Build107 software + Android engineering candidate
    if: github.ref_name == 'feat/tutop-post106-security-fcm'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Prove source and preserve build106 authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node -p "require('./package.json').version")" = "$TUTOP_BETA_VERSION"
          test "$(node -p "require('./package-lock.json').version")" = "$TUTOP_BETA_VERSION"
          CURRENT="$(git ls-remote origin refs/heads/feat/tutop-0.9.2-hardening | cut -f1)"
          test "$CURRENT" = "$TUTOP_BUILD106_SHA"

      - name: Install exact app dependencies
        run: npm ci

      - name: Install ephemeral emulator harness
        run: npm install --no-save --package-lock=false --no-audit --no-fund @firebase/rules-unit-testing@5.0.2 firebase@12.18.0

      - name: Keep dependency manifests immutable
        run: git diff --exit-code -- package.json package-lock.json

      - name: Full regression + TypeScript + recovered runtime contracts
        run: |
          npm run check
          npm run typecheck
          node scripts/verified-email-beta-contract-tests.mjs
          node scripts/post106-runtime-recovery-contract-tests.mjs
          node scripts/marketplace-notification-projection-tests.mjs

      - name: Compose exact post106 Rules
        run: npm run v2:rules:prepare

      - name: Prove atomic verified-email Rules in emulator
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --project tutop-post106-build107-emulator
          --config firebase.v2.json
          --only firestore
          "node --test --test-concurrency=1 tests/firestore.v2.post106-verified-identity.test.mjs"

      - name: Recover only validated public Firebase client configuration from build106
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/build106
          gh run download "$TUTOP_BUILD106_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$TUTOP_BUILD106_ARTIFACT" --dir /tmp/build106
          test "$(sha256sum /tmp/build106/TuTop-0.9.2-beta.0-physical-qa-staging.apk | awk '{print $1}')" = "$TUTOP_BUILD106_APK_SHA256"
          python3 - <<'PY'
          import json, re, zipfile, pathlib, os
          apk = pathlib.Path('/tmp/build106/TuTop-0.9.2-beta.0-physical-qa-staging.apk')
          project='tutop-beta-vicmdlb-1356585881'; package='mx.tutop.app'
          with zipfile.ZipFile(apk) as z:
              js='\n'.join(z.read(n).decode('utf-8','ignore') for n in z.namelist() if n.startswith('assets/public/assets/') and n.endswith('.js'))
          raw=apk.read_bytes()
          def one(pattern,data,label):
              m=re.search(pattern,data)
              if not m: raise SystemExit('MISSING_VALIDATED_CLIENT_VALUE:'+label)
              v=m.group(1); return v.decode() if isinstance(v,bytes) else v
          web_key=one(r'VITE_FIREBASE_API_KEY:`([^`]+)`',js,'web_api_key')
          web_app=one(r'VITE_FIREBASE_APP_ID:`([^`]+)`',js,'web_app_id')
          android_app=one(rb'(1:900056291310:android:[0-9a-f]+)',raw,'android_app_id')
          android_key=one(rb'(AIza[0-9A-Za-z_-]{30,50})',raw,'android_api_key')
          storage=one(rb'(tutop-beta-vicmdlb-1356585881(?:\.firebasestorage\.app|\.appspot\.com))',raw,'storage_bucket')
          if project not in js: raise SystemExit('VALIDATED_PROJECT_MISMATCH')
          pathlib.Path('.tutop-staging-google-services.json').write_text(json.dumps({
            'project_info':{'project_number':'900056291310','project_id':project,'storage_bucket':storage},
            'client':[{'client_info':{'mobilesdk_app_id':android_app,'android_client_info':{'package_name':package}},'oauth_client':[],'api_key':[{'current_key':android_key}],'services':{'appinvite_service':{'other_platform_oauth_client':[]}}}],
            'configuration_version':'1'}))
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write(f'VITE_FIREBASE_API_KEY={web_key}\nVITE_FIREBASE_AUTH_DOMAIN={project}.firebaseapp.com\nVITE_FIREBASE_PROJECT_ID={project}\nVITE_FIREBASE_APP_ID={web_app}\nVITE_FIREBASE_STORAGE_BUCKET={storage}\n')
          for value in (web_key,web_app,android_key,android_app): print('::add-mask::'+value)
          print('✅ recovered public build106 Firebase client config only; no Rules/deploy mutation performed')
          PY

      - name: Build production-shape web bundle
        run: npm run build

      - name: Install ephemeral Capacitor/native Firebase dependencies
        run: npm run deps:mobile

      - name: Keep manifests immutable after mobile dependencies
        run: git diff --exit-code -- package.json package-lock.json

      - name: Generate Android project and set build107 versionCode
        run: |
          npm run android:bootstrap
          node scripts/configure-android-beta-version.mjs
          npm run android:doctor

      - name: Verify build107 native shape and zero-cost locks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode 90201' android/app/build.gradle
          grep -q 'versionName "0.9.2-beta.0"' android/app/build.gradle
          grep -q 'ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
          ! grep -q 'ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          ! grep -q 'ACCESS_BACKGROUND_LOCATION' android/app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          ! grep -q 'READ_EXTERNAL_STORAGE' android/app/src/main/AndroidManifest.xml
          ! grep -q 'WRITE_EXTERNAL_STORAGE' android/app/src/main/AndroidManifest.xml
          grep -q 'RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'firebase-appcheck-playintegrity' node_modules/@capacitor-firebase/app-check/android/build.gradle

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v6

      - name: Android clean lint unit tests and APK assembly
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean lintDebug testDebugUnitTest assembleDebug

      - name: Stage build107 APK + checksum + provenance
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk "$TUTOP_APK_PATH"
          HASH="$(sha256sum "$TUTOP_APK_PATH" | awk '{print $1}')"
          SIZE="$(wc -c < "$TUTOP_APK_PATH" | tr -d ' ')"
          printf '%s  %s\n' "$HASH" "$TUTOP_APK_PATH" > "$TUTOP_APK_SHA256_PATH"
          echo "apk_sha256=$HASH" >> "$GITHUB_OUTPUT"
          echo "apk_size=$SIZE" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json, os, pathlib
          apk_hash=pathlib.Path(os.environ['TUTOP_APK_SHA256_PATH']).read_text().split()[0]
          data={
            'schema':'tutop.post106-engineering-candidate.v1',
            'engineering_build':107,
            'app_version':'0.9.2-beta.0',
            'android_version_code':90201,
            'source_sha':os.environ['GITHUB_SHA'],
            'github_run_id':int(os.environ['GITHUB_RUN_ID']),
            'apk':os.environ['TUTOP_APK_PATH'],
            'apk_sha256':apk_hash,
            'fixed_runtime_defects':['optional_phone_normalization','pre_auth_phone_validation','verify_email_bootstrap_order','late_session_resurrection','app_check_unbounded_wait','location_watch_cleanup_race'],
            'verified_email_rules_emulator_pass_required':True,
            'shared_staging_rules_deployed':False,
            'shared_staging_atomic_cutover_required_before_physical_use':True,
            'real_fcm_apply_send_proven':False,
            'physical_device_passes':0,
            'physical_candidate_promoted':False,
            'build106_remains_physical_authority':True,
            'production_ready':False,
            'play_ready':False,
            'cost_lock':'SPEND=0; NO Blaze/SMS billing/Storage-video/Play/prod/merge'
          }
          pathlib.Path('POST106_ENGINEERING_CANDIDATE_BUILD107.json').write_text(json.dumps(data,indent=2)+'\n')
          PY

      - name: Upload immutable engineering candidate
        uses: actions/upload-artifact@v7
        with:
          name: TuTop-post106-engineering-build107-${{ github.run_number }}
          path: |
            TuTop-0.9.2-beta.0-engineering-build107.apk
            TuTop-0.9.2-beta.0-engineering-build107.apk.sha256
            POST106_ENGINEERING_CANDIDATE_BUILD107.json
          if-no-files-found: error
          retention-days: 90

      - name: Remove recovered public Firebase config
        if: always()
        run: rm -f .tutop-staging-google-services.json android/app/google-services.json
