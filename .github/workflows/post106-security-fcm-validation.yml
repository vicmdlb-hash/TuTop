name: TuTop post106 security + FCM validation

on:
  push:
    branches:
      - feat/tutop-post106-security-fcm
      - fix/tutop-post110-fcm-delivery
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tutop-post106-security-fcm-${{ github.ref }}
  cancel-in-progress: true

env:
  TUTOP_FIREBASE_PROJECT_ID: tutop-beta-vicmdlb-1356585881
  FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
  TUTOP_FIREBASE_OAUTH_CLIENT_ID: ${{ secrets.FIREBASE_OAUTH_CLIENT_ID }}
  TUTOP_FIREBASE_OAUTH_CLIENT_SECRET: ${{ secrets.FIREBASE_OAUTH_CLIENT_SECRET }}

jobs:
  validate:
    if: github.ref_name == 'feat/tutop-post106-security-fcm' || github.ref_name == 'fix/tutop-post110-fcm-delivery'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact follow-up SHA
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Java 21 for Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install exact dependencies
        run: npm ci

      - name: Install ephemeral Firestore emulator test harness
        run: npm install --no-save --package-lock=false --no-audit --no-fund @firebase/rules-unit-testing@5.0.2 firebase@12.18.0

      - name: Verify dependency manifests stayed immutable
        run: git diff --exit-code -- package.json package-lock.json

      - name: Existing regression suite
        run: npm run check

      - name: TypeScript
        run: npm run typecheck

      - name: Verified email beta Auth + Rules contracts
        run: node scripts/verified-email-beta-contract-tests.mjs

      - name: Post106 runtime recovery contracts
        run: node scripts/post106-runtime-recovery-contract-tests.mjs

      - name: Compose exact post106 Firestore Rules
        run: npm run v2:rules:prepare

      - name: Post106 verified identity Firestore emulator gate
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --project tutop-post106-emulator
          --config firebase.v2.json
          --only firestore
          "node --test --test-concurrency=1 tests/firestore.v2.post106-verified-identity.test.mjs"

      - name: Trusted marketplace notification projection tests
        run: node scripts/marketplace-notification-projection-tests.mjs

      - name: FCM sender payload contract
        run: node scripts/fcm-sender-contract-tests.mjs

      - name: Require managed staging credentials for dry-run
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FIREBASE_TOKEN:-}"
          if [ -n "${TUTOP_FIREBASE_OAUTH_CLIENT_ID:-}" ] || [ -n "${TUTOP_FIREBASE_OAUTH_CLIENT_SECRET:-}" ]; then
            test -n "${TUTOP_FIREBASE_OAUTH_CLIENT_ID:-}"
            test -n "${TUTOP_FIREBASE_OAUTH_CLIENT_SECRET:-}"
          fi

      - name: Staging marketplace notification projection dry-run only
        env:
          TUTOP_ALLOW_V2_MAINTENANCE: staging-v2
        run: node scripts/v2-marketplace-notification-projector.mjs

      - name: Post110 FCM sender staging dry-run only
        if: github.ref_name == 'fix/tutop-post110-fcm-delivery'
        env:
          TUTOP_ALLOW_V2_MAINTENANCE: staging-v2
        run: node scripts/post110-fcm-sender.mjs

      - name: Preserve build106 candidate branch
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(git ls-remote origin refs/heads/feat/tutop-0.9.2-hardening | cut -f1)"
          test "$CURRENT" = "b54b03cb01d1b3ec42dd1458ad3e1bb3bd22043c"
          echo "✅ build106 candidate remains frozen at $CURRENT"
