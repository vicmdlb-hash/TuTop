name: Post116 CI candidate trigger hygiene — no APK no deploy

on:
  push:
    branches: [integration/post116-ci-candidate-trigger-hygiene]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tutop-post116-ci-candidate-trigger-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.ref_name == 'integration/post116-ci-candidate-trigger-hygiene'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci

      - name: Historical candidate trigger hygiene
        run: node scripts/post116-ci-candidate-trigger-hygiene-tests.mjs
      - name: Accessibility semantics contract
        run: node scripts/post116-accessibility-semantics-tests.mjs
      - name: Firebase request timeout and recovery
        run: node --experimental-strip-types scripts/post116-firebase-request-timeout-tests.mjs
      - name: Moderation privacy integration contracts
        run: node scripts/post116-pr88-moderation-privacy-integration-tests.mjs
      - name: Seller moderation visibility truth
        run: node scripts/post116-seller-moderation-truth-tests.mjs
      - name: Nearby moderation freshness
        run: node scripts/post116-nearby-moderation-freshness-tests.mjs
      - name: Rules composition contract
        run: node scripts/v2-rules-composition-contract-tests.mjs
      - name: Listing moderation race client precondition
        run: node scripts/post116-listing-moderation-race-tests.mjs

      - name: Push permission vs registration truth
        run: node scripts/post116-push-health-contract-tests.mjs
      - name: Push logout ownership cleanup
        run: node scripts/post116-push-ownership-contract-tests.mjs
      - name: Push account isolation
        run: node scripts/post116-push-account-isolation-tests.mjs
      - name: Prove no real FCM sender execution
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/post116-fcm-owner-safe-sender.mjs
          grep -Fq "const apply = process.argv.includes('--apply')" scripts/post116-fcm-owner-safe-sender.mjs
          echo "PASS sender support present but not executed"

      - name: PR87 erasure pagination
        run: node scripts/firestore-query-pagination-tests.mjs
      - name: PR87 erasure completion attestation
        run: node scripts/post116-erasure-completion-attestation-tests.mjs
      - name: PR87 erasure residual manifest
        run: node scripts/account-erasure-tests.mjs
      - name: PR87 user-facing completion truth
        run: node --experimental-strip-types scripts/post116-erasure-user-status-truth-tests.mjs

      - name: Structured Topi regression
        run: node --experimental-strip-types scripts/post116-pr85-topi-structured-tests.mjs
      - name: Privacy integration regression
        run: node --experimental-strip-types scripts/post116-pr84-privacy-integration-tests.mjs
      - name: Durable publish draft regression
        run: node --experimental-strip-types scripts/post116-durable-publish-draft-tests.mjs
      - name: Idempotent publication retry regression
        run: node scripts/post116-publish-idempotency-tests.mjs
      - name: Existing build116 feedback regression
        run: node scripts/build116-deviceA-feedback-tests.mjs
      - name: Canonical bridge coverage
        run: node scripts/v2-canonical-bridge-coverage-tests.mjs
      - name: PR82 publication contract
        run: node scripts/post116-publication-client-contract-tests.mjs
      - name: PR82 server-authoritative rate window
        run: node scripts/post116-rate-window-runtime-tests.mjs

      - name: Full existing regression
        run: npm run check
      - name: Exact typecheck
        run: npm run typecheck
      - name: Production web build
        run: npm run build
      - name: Compose strict V2 Rules
        run: npm run v2:rules:prepare

      - name: Emulator dependencies
        run: npm install --no-save --package-lock=false --no-audit --no-fund firebase@12.18.0 @firebase/rules-unit-testing@5.0.2 firebase-tools@15.30.1
      - name: Governance + least privilege + account + publication Rules
        run: >
          npx firebase emulators:exec --only firestore
          --project demo-tutop-post116-ci-candidate-trigger-hygiene
          --config firebase.v2.json
          "node --test --test-concurrency=1
          tests/firestore.v2.governance.test.mjs
          tests/firestore.v2.private-admin-reads.test.mjs
          tests/firestore.v2.account-operations.test.mjs
          tests/firestore.verified-email.test.mjs
          tests/firestore.v2.post106-verified-identity.test.mjs
          tests/firestore.v2.runtime-services.test.mjs"

      - name: No dependency drift
        run: git diff --exit-code -- package.json package-lock.json
      - name: Prove no Android candidate work exists
        shell: bash
        run: |
          set -euo pipefail
          test ! -d android/app/build/outputs/apk || test -z "$(find android/app/build/outputs/apk -type f -name '*.apk' -print -quit 2>/dev/null)"
          echo "PASS no APK generated"
