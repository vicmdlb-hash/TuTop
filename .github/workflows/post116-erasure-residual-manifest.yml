name: Post-build116 erasure residual manifest

on:
  push:
    branches: [hardening/post116-erasure-residual-manifest]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/account-erasure-tests.mjs
      - run: npm run account-erasure:synthetic:test
      - run: npm run retention-matrix:test
      - run: npm run legal-retention-review:test
