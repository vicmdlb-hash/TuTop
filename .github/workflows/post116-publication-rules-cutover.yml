name: Post116 publication Rules cutover

on:
  push:
    branches: [ops/post116-publication-rules-cutover]

permissions:
  contents: read

concurrency:
  group: tutop-post116-publication-rules-cutover
  cancel-in-progress: false

jobs:
  cutover:
    if: contains(github.event.head_commit.message, 'POST116_RULES_ACTION_ID=post116-publication-rules-20260919-01')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TUTOP_FIREBASE_PROJECT_ID: tutop-beta-vicmdlb-1356585881
      TUTOP_POST116_RULES_ACK: POST116_PUBLICATION_RULES_REPAIR_ONLY
      TUTOP_POST116_RULES_ACTION_ID: post116-publication-rules-20260919-01
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run v2:rules:prepare

      - name: Assert exact repair shape before live mutation
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const r=fs.readFileSync('firebase/firestore.v2.generated.rules','utf8');
          const start=r.indexOf('match /listings_v2/{listingId}');
          const end=r.indexOf('match /offers/{offerId}',start);
          if(start<0||end<0) throw new Error('listings_v2 block missing');
          const block=r.slice(start,end);
          if(block.includes('productMatchesSellerIdentity(request.resource.data, request.auth.uid)')) throw new Error('stale profile gate still present');
          if(!block.includes('validUniversityMetadata(request.resource.data)')) throw new Error('canonical metadata validation missing');
          if(!block.includes('request.resource.data.seller_id == request.auth.uid')) throw new Error('seller auth guard missing');
          NODE

      - name: Emulator dependencies
        run: npm install --no-save --package-lock=false --no-audit --no-fund firebase@12.18.0 @firebase/rules-unit-testing@5.0.2 firebase-tools@15.30.1

      - name: Exact stale-profile blocker regression
        run: npx firebase emulators:exec --only firestore --project demo-tutop-publication-profile-coupling --config firebase.v2.json "node --test --test-concurrency=1 tests/firestore.v2.publication-profile-coupling.test.mjs"

      - name: Verified-email publication regression
        run: npx firebase emulators:exec --only firestore --project demo-tutop-publication-verified --config firebase.v2.json "node --test --test-concurrency=1 tests/firestore.v2.post106-verified-identity.test.mjs"

      - name: Controlled minimal staging Rules repair
        run: node scripts/post116-publication-rules-cutover.mjs --apply

      - name: Preserve exact cutover evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: TuTop-post116-publication-rules-${{ github.run_id }}
          path: staging-post116-repair/applied.json
          retention-days: 30
          if-no-files-found: error

      - name: No dependency drift
        if: always()
        run: git diff --exit-code -- package.json package-lock.json
