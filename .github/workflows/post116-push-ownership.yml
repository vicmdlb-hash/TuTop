name: Post-build116 push ownership cleanup

on:
  push:
    branches: [hardening/post116-push-ownership]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: node scripts/post116-push-health-contract-tests.mjs
      - run: node scripts/post116-push-ownership-contract-tests.mjs
      - run: npm run native-security:test
