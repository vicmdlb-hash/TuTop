name: Post-build116 reservation offer guard

on:
  push:
    branches: [hardening/post116-reservation-offer-guard]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run v2:rules:prepare
      - name: Emulator dependencies
        run: npm install --no-save --package-lock=false --no-audit --no-fund firebase@12.18.0 @firebase/rules-unit-testing@5.0.2 firebase-tools@15.30.1
      - name: Reservation lock emulator
        run: npx firebase emulators:exec --only firestore --project demo-tutop-post116-reservation --config firebase.v2.json "node --test --test-concurrency=1 tests/firestore.v2.transaction-lock.test.mjs"
