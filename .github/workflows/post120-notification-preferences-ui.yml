name: Post120 notification preferences UI — source only

on:
  push:
    branches: [feat/post120-notification-preferences-ui]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Notification preferences UI contract
        run: node scripts/post120-notification-preferences-ui-tests.mjs
      - name: Notification projector preference enforcement
        run: node scripts/post120-notification-preference-projection-tests.mjs
      - name: Saved-search alert projection
        run: |
          node scripts/post120-saved-search-alert-projector-tests.mjs
          node scripts/post120-saved-search-alert-contract-tests.mjs
      - name: Saved-search management controls
        run: node scripts/post120-saved-search-manager-tests.mjs
      - name: Reservation and meetup temporal reminders
        run: |
          node scripts/post120-temporal-reminder-tests.mjs
          node scripts/post120-temporal-reminder-contract-tests.mjs
      - name: Listing-saved opt-in notifications
        run: |
          node scripts/post120-listing-saved-notification-tests.mjs
          node scripts/post120-listing-saved-notification-contract-tests.mjs
      - name: Favorite price/availability transition watch
        run: |
          node scripts/post120-favorite-listing-transition-tests.mjs
          node scripts/post120-favorite-listing-transition-contract-tests.mjs
      - name: Seller follow graph + followed-seller alerts
        run: |
          node scripts/post120-followed-seller-notification-tests.mjs
          node scripts/post120-seller-follow-contract-tests.mjs
      - name: Prepare final V2 Rules for focused seller-follow emulator
        run: npm run v2:rules:prepare
      - name: Install ephemeral Firestore emulator harness
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund @firebase/rules-unit-testing@5.0.2 firebase@12.18.0
          git diff --exit-code -- package.json package-lock.json
      - name: Seller-follow Rules emulator
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --only firestore
          --config firebase.v2.json
          --project demo-tutop-seller-follows
          "node --test tests/firestore.v2.seller-follows.test.mjs"
      - name: Notification producer coverage truth
        run: node scripts/post120-notification-producer-coverage-tests.mjs
      - name: Notification regressions
        run: |
          node scripts/saved-search-notification-tests.mjs
          node scripts/marketplace-notification-projection-tests.mjs
          node scripts/post116-push-health-contract-tests.mjs
      - name: Full regression
        run: npm run check
      - name: Typecheck
        run: npm run typecheck
      - name: Web build
        run: npm run build
      - name: Prove source-only
        run: |
          test ! -d android/app/build/outputs || test -z "$(find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit 2>/dev/null)"
          echo "PASS source-only notification preference controls; Build120 APK unchanged"
