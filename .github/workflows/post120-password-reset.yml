name: Post120 email password reset — source only

on:
  push:
    branches: [feat/post120-email-password-reset]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Password reset contract — no email sent by CI
        run: node scripts/post120-password-reset-contract-tests.mjs
      - name: Verified email/Auth regressions
        run: |
          node scripts/verified-email-runtime-tests.mjs
          node scripts/verified-email-beta-contract-tests.mjs
          node --experimental-strip-types scripts/firebase-session-hardening-tests.mjs
      - name: Full regression
        run: npm run check
      - name: Typecheck
        run: npm run typecheck
      - name: Web build
        run: npm run build
      - name: Prove source-only
        run: |
          test ! -d android/app/build/outputs || test -z "$(find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit 2>/dev/null)"
          echo "PASS source-only password reset feature; no recovery email sent by CI and Build120 APK unchanged"
