name: Post120 physical failure cluster — source repair only

on:
  push:
    branches: [fix/post120-physical-failure-cluster]
  pull_request:
    branches: [integration/post120-green-suite]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tutop-post120-physical-failure-cluster-v3-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'fix/post120-physical-failure-cluster'
    runs-on: ubuntu-24.04
    env:
      TUTOP_FIREBASE_PROJECT_ID: tutop-beta-vicmdlb-1356585881
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      TUTOP_FIREBASE_OAUTH_CLIENT_ID: ${{ secrets.TUTOP_FIREBASE_OAUTH_CLIENT_ID }}
      TUTOP_FIREBASE_OAUTH_CLIENT_SECRET: ${{ secrets.TUTOP_FIREBASE_OAUTH_CLIENT_SECRET }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate and validate exact V2 Rules
        run: |
          npm run v2:rules:prepare
          node scripts/verified-email-beta-contract-tests.mjs
          node scripts/post117-generated-rules-least-privilege-tests.mjs
          node scripts/v2-rules-access-budget-tests.mjs
      - name: Physical failure cluster contracts
        run: |
          node scripts/first-admin-bootstrap-gate-tests.mjs
          node scripts/post120-physical-failure-cluster-tests.mjs
          node scripts/next-candidate-signing-binding-tests.mjs
          node scripts/build118-deviceA-native-failure-diagnostics-tests.mjs
          node scripts/post120-admin-account-status-contract-tests.mjs
          node scripts/post120-fcm-single-target-gate-tests.mjs
          node scripts/post120-fcm-physical-gate-contract-tests.mjs
      - name: Privacy / account-erasure contracts
        run: |
          node scripts/account-erasure-tests.mjs
          node scripts/post116-erasure-completion-attestation-tests.mjs
          node scripts/post116-erasure-user-status-truth-tests.mjs
          node scripts/retention-matrix-tests.mjs
          node scripts/legal-retention-dossier-tests.mjs
      - name: Push account-isolation contracts
        run: |
          node scripts/post116-push-account-isolation-tests.mjs
          node scripts/post116-push-ownership-contract-tests.mjs
          node scripts/post116-push-health-contract-tests.mjs
          node scripts/post120-fcm-single-target-gate-tests.mjs
          node scripts/post120-fcm-physical-gate-contract-tests.mjs
      - name: Full source regression
        run: npm run check
      - name: Typecheck
        run: npm run typecheck
      - name: Web build
        run: npm run build
      - name: Live staging Auth client config/key readback — no mutation
        run: node scripts/audit-staging-auth-client-config.mjs
      - name: Live staging Auth email configuration readback — no mutation
        run: node scripts/audit-staging-auth-email-config.mjs
      - name: Live staging App Check readback — no mutation
        run: node scripts/audit-staging-offplay-app-check.mjs
      - name: Prove no candidate artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test ! -d android/app/build/outputs || test -z "$(find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit 2>/dev/null)"
          echo "PASS source repair only; no APK/AAB/Build121"
