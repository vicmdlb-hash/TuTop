name: TuTop quality gate

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tutop-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    name: Web + policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Local regression checks
        run: npm run check

      - name: GitHub readiness
        run: npm run github:ready

      - name: Beta readiness
        run: npm run beta:ready

      - name: V2 catalog dry run
        run: npm run v2:catalog:plan

      - name: Reputation evidence contract
        run: npm run reputation:test

      - name: Trusted reputation aggregation
        run: npm run trusted-reputation:test

      - name: Public seller profile privacy
        run: npm run seller-profile:privacy:test

      - name: Typecheck
        run: npm run typecheck

      - name: Build web app
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: TuTop-web-${{ github.run_number }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  firestore-v2-security:
    name: Firestore V2 emulator security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install app dependencies
        run: npm ci

      - name: Install emulator test harness
        run: npm install --no-save @firebase/rules-unit-testing firebase firebase-tools

      - name: Firestore V2 abuse + atomic batch + trusted reputation tests
        run: npx firebase-tools emulators:exec --only firestore --config firebase.v2.json --project demo-tutop-v2-rules "node --test tests/firestore.v2.rules.test.mjs tests/firestore.v2.atomic.test.mjs tests/firestore.v2.acceptance-atomic.test.mjs tests/firestore.v2.reputation-trust.test.mjs"
