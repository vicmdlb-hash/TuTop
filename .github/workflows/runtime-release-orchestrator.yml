name: TuTop runtime release orchestrator

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: tutop-runtime-release-orchestrator
  cancel-in-progress: false

jobs:
  release-chain:
    name: October → Staging → Android → verified APK
    if: github.ref_name == 'main'
    runs-on: [self-hosted, linux, x64, tutop-zero-cost-controller]
    timeout-minutes: 150
    env:
      TARGET_REF: feat/tutop-0.8-p0
      TARGET_PR: "6"
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      TUTOP_FIREBASE_OAUTH_CLIENT_ID: ${{ secrets.FIREBASE_OAUTH_CLIENT_ID }}
      TUTOP_FIREBASE_OAUTH_CLIENT_SECRET: ${{ secrets.FIREBASE_OAUTH_CLIENT_SECRET }}

    steps:
      - name: Resolve Firebase credential mode on self-hosted controller
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_TOKEN:-}" ] && [ -n "${TUTOP_FIREBASE_OAUTH_CLIENT_ID:-}" ] && [ -n "${TUTOP_FIREBASE_OAUTH_CLIENT_SECRET:-}" ]; then
            echo "TUTOP_FIREBASE_AUTH_MODE=managed_refresh_token" >> "$GITHUB_ENV"
            echo "Firebase auth preflight: managed refresh-token credentials are present (values not printed)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if command -v gcloud >/dev/null 2>&1; then
            ACCESS_TOKEN="$(gcloud auth application-default print-access-token 2>/dev/null || true)"
            if [ -n "$ACCESS_TOKEN" ]; then
              echo "::add-mask::$ACCESS_TOKEN"
              {
                echo "TUTOP_FIREBASE_ACCESS_TOKEN=$ACCESS_TOKEN"
                echo "TUTOP_FIREBASE_AUTH_MODE=local_adc"
                echo "FIREBASE_TOKEN="
                echo "TUTOP_FIREBASE_OAUTH_CLIENT_ID="
                echo "TUTOP_FIREBASE_OAUTH_CLIENT_SECRET="
              } >> "$GITHUB_ENV"
              echo "Firebase auth preflight: local Application Default Credentials are valid on the self-hosted controller." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo "DETENIDO: no hay credencial Firebase utilizable." >&2
          exit 42

      - name: Capture exact target HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/commits/${TARGET_REF}" --jq '.sha')"
          if ! [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "DETENIDO: no se pudo resolver SHA exacto de ${TARGET_REF}." >&2
            exit 41
          fi
          echo "TARGET_SHA=${TARGET_SHA}" >> "$GITHUB_ENV"
          echo "Target exacto: ${TARGET_REF}@${TARGET_SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: Record 60% credentials milestone
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BODY="## APK readiness — 60%\n\nFirebase credential preflight succeeded via \`${TUTOP_FIREBASE_AUTH_MODE}\`. Target: \`${TARGET_REF}@${TARGET_SHA}\`."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR}/comments" -f body="$BODY" >/dev/null 2>&1 || true

      - name: Run October exact-SHA gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/commits/${TARGET_REF}" --jq '.sha')"
          test "$current" = "$TARGET_SHA"
          before="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/october-01-validation.yml/runs" -f branch="$TARGET_REF" -f head_sha="$TARGET_SHA" -f event=workflow_dispatch -f per_page=20 --jq '.workflow_runs[0].id // 0')"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/october-01-validation.yml/dispatches" -f ref="$TARGET_REF" >/dev/null
          for attempt in $(seq 1 240); do
            json="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/october-01-validation.yml/runs" -f branch="$TARGET_REF" -f head_sha="$TARGET_SHA" -f event=workflow_dispatch -f per_page=20)"
            run_id="$(printf '%s' "$json" | jq -r --arg before "$before" '.workflow_runs | map(select(.id > ($before|tonumber))) | .[0].id // empty')"
            if [ -n "$run_id" ]; then
              status="$(printf '%s' "$json" | jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status')"
              conclusion="$(printf '%s' "$json" | jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .conclusion // ""')"
              echo "October: run=${run_id} status=${status} conclusion=${conclusion:-pending}"
              if [ "$status" = "completed" ]; then
                test "$conclusion" = "success"
                echo "OCTOBER_RUN_ID=${run_id}" >> "$GITHUB_ENV"
                echo "✅ October green: ${run_id}" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "DETENIDO: timeout esperando October." >&2
          exit 50

      - name: Record 75% October milestone
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          BODY="## APK readiness — 75%\n\nOctober exact-SHA green. Run: \`${OCTOBER_RUN_ID}\`. Target: \`${TARGET_REF}@${TARGET_SHA}\`."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR}/comments" -f body="$BODY" >/dev/null 2>&1 || true

      - name: Run Staging same-SHA gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/commits/${TARGET_REF}" --jq '.sha')"
          test "$current" = "$TARGET_SHA"
          before="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/staging-v2-smoke.yml/runs" -f branch="$TARGET_REF" -f head_sha="$TARGET_SHA" -f event=workflow_dispatch -f per_page=20 --jq '.workflow_runs[0].id // 0')"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/staging-v2-smoke.yml/dispatches" -f ref="$TARGET_REF" >/dev/null
          for attempt in $(seq 1 240); do
            json="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/staging-v2-smoke.yml/runs" -f branch="$TARGET_REF" -f head_sha="$TARGET_SHA" -f event=workflow_dispatch -f per_page=20)"
            run_id="$(printf '%s' "$json" | jq -r --arg before "$before" '.workflow_runs | map(select(.id > ($before|tonumber))) | .[0].id // empty')"
            if [ -n "$run_id" ]; then
              status="$(printf '%s' "$json" | jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status')"
              conclusion="$(printf '%s' "$json" | jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .conclusion // ""')"
              echo "Staging: run=${run_id} status=${status} conclusion=${conclusion:-pending}"
              if [ "$status" = "completed" ]; then
                test "$conclusion" = "success"
                echo "STAGING_RUN_ID=${run_id}" >> "$GITHUB_ENV"
                echo "✅ Staging green: ${run_id}" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "DETENIDO: timeout esperando Staging." >&2
          exit 50

      - name: Record 85% Staging milestone
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          BODY="## APK readiness — 85%\n\nStaging same-SHA green. October: \`${OCTOBER_RUN_ID}\`; Staging: \`${STAGING_RUN_ID}\`. Target: \`${TARGET_REF}@${TARGET_SHA}\`."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR}/comments" -f body="$BODY" >/dev/null 2>&1 || true

      - name: Run Android same-SHA gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/commits/${TARGET_REF}" --jq '.sha')"
          test "$current" = "$TARGET_SHA"
          before="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/android-debug-apk.yml/runs" -f branch="$TARGET_REF" -f head_sha="$TARGET_SHA" -f event=workflow_dispatch -f per_page=20 --jq '.workflow_runs[0].id // 0')"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/android-debug-apk.yml/dispatches" -f ref="$TARGET_REF" >/dev/null
          for attempt in $(seq 1 240); do
            json="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/android-debug-apk.yml/runs" -f branch="$TARGET_REF" -f head_sha="$TARGET_SHA" -f event=workflow_dispatch -f per_page=20)"
            run_id="$(printf '%s' "$json" | jq -r --arg before "$before" '.workflow_runs | map(select(.id > ($before|tonumber))) | .[0].id // empty')"
            if [ -n "$run_id" ]; then
              status="$(printf '%s' "$json" | jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status')"
              conclusion="$(printf '%s' "$json" | jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .conclusion // ""')"
              echo "Android: run=${run_id} status=${status} conclusion=${conclusion:-pending}"
              if [ "$status" = "completed" ]; then
                test "$conclusion" = "success"
                echo "ANDROID_RUN_ID=${run_id}" >> "$GITHUB_ENV"
                echo "✅ Android green: ${run_id}" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "DETENIDO: timeout esperando Android." >&2
          exit 50

      - name: Record 95% Android milestone
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          BODY="## APK readiness — 95%\n\nAndroid exact-SHA green. Run: \`${ANDROID_RUN_ID}\`. APK bytes still require independent verification. Target: \`${TARGET_REF}@${TARGET_SHA}\`."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR}/comments" -f body="$BODY" >/dev/null 2>&1 || true

      - name: Download and independently verify APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OCTOBER_RUN_ID:-}"
          test -n "${STAGING_RUN_ID:-}"
          test -n "${ANDROID_RUN_ID:-}"
          ARTIFACT_JSON="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${ANDROID_RUN_ID}/artifacts" -f per_page=100)"
          APK_ARTIFACT_ID="$(printf '%s' "$ARTIFACT_JSON" | jq -r '.artifacts | map(select(.expired == false and (.name | startswith("TuTop-0.9.0-beta.0-physical-qa-staging-")))) | .[0].id // empty')"
          APK_ARTIFACT_NAME="$(printf '%s' "$ARTIFACT_JSON" | jq -r '.artifacts | map(select(.expired == false and (.name | startswith("TuTop-0.9.0-beta.0-physical-qa-staging-")))) | .[0].name // empty')"
          test -n "$APK_ARTIFACT_ID"
          test -n "$APK_ARTIFACT_NAME"
          rm -rf apk-verified
          mkdir -p apk-verified
          gh run download "$ANDROID_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$APK_ARTIFACT_NAME" --dir apk-verified
          APK_FILE="apk-verified/TuTop-0.9.0-beta.0-physical-qa-staging.apk"
          HASH_FILE="apk-verified/TuTop-0.9.0-beta.0-physical-qa-staging.apk.sha256"
          META_FILE="apk-verified/TuTop-0.9.0-beta.0-physical-qa-staging.metadata.txt"
          test -s "$APK_FILE"
          test -s "$HASH_FILE"
          test -s "$META_FILE"
          EXPECTED_SHA="$(awk '{print $1; exit}' "$HASH_FILE")"
          ACTUAL_SHA="$(sha256sum "$APK_FILE" | awk '{print $1}')"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          grep -q "head_sha=${TARGET_SHA}" "$META_FILE"
          grep -q "gate_run_id=${OCTOBER_RUN_ID}" "$META_FILE"
          grep -q "staging_smoke_run_id=${STAGING_RUN_ID}" "$META_FILE"
          grep -q 'reviews_lazy_cutover=false' "$META_FILE"
          grep -q 'wallet_lazy_cutover=false' "$META_FILE"
          grep -q 'favorites_visible_cutover=false' "$META_FILE"
          echo "APK_ARTIFACT_ID=${APK_ARTIFACT_ID}" >> "$GITHUB_ENV"
          echo "APK_ARTIFACT_NAME=${APK_ARTIFACT_NAME}" >> "$GITHUB_ENV"
          echo "APK_SHA256=${ACTUAL_SHA}" >> "$GITHUB_ENV"
          echo "✅ APK independently verified: ${ACTUAL_SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: Record 100% APK readiness on PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          BODY="## APK readiness — 100%\n\nReal installable APK verified. Target: \`${TARGET_REF}@${TARGET_SHA}\`. October: \`${OCTOBER_RUN_ID}\`; Staging: \`${STAGING_RUN_ID}\`; Android: \`${ANDROID_RUN_ID}\`; Artifact: \`${APK_ARTIFACT_ID}\`; SHA-256: \`${APK_SHA256}\`. Physical QA A+B remains pending."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR}/comments" -f body="$BODY" >/dev/null 2>&1 || true

      - name: Record blocked orchestrator result
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          BODY="Runtime release orchestrator stopped fail-closed for ${TARGET_REF}@${TARGET_SHA:-UNKNOWN}. Inspect run ${GITHUB_RUN_ID}; no later gate is promoted after a failed predecessor."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR}/comments" -f body="$BODY" >/dev/null 2>&1 || true
