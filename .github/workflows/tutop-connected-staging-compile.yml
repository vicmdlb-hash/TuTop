name: TuTop connected Firebase V2 compile check (NO deploy)
on:
  push:
    branches:
      - integration/tutop-121-122-fcm-owner-ci-20261022
    paths:
      - .github/workflows/tutop-connected-staging-compile.yml
permissions:
  contents: read
concurrency:
  group: tutop-connected-staging-read-only
  cancel-in-progress: false
jobs:
  connected-android-compile:
    if: github.repository == 'vicmdlb-hash/TuTop'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      TUTOP_FIREBASE_PROJECT_ID: tutop-beta-vicmdlb-1356585881
      TUTOP_ALLOW_STAGING_CONFIG_READ: read-only-v2
      TUTOP_ANDROID_PACKAGE_NAME: mx.tutop.app
      VITE_TUTOP_SCHEMA_V2: 'true'
      VITE_TUTOP_ENVIRONMENT: staging
      VITE_TUTOP_TOPI_REMOTE_ENABLED: 'false'
      VITE_TUTOP_TOPI_FIREBASE_AI_ENABLED: 'false'
      VITE_TUTOP_TOPI_GUIDED_BETA: 'true'
      VITE_TUTOP_MEDIA_STORAGE_ENABLED: 'false'
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify isolated source and no mutation permissions
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "integration/tutop-121-122-fcm-owner-ci-20261022"
          test "${TUTOP_ALLOW_STAGING_CONFIG_READ}" = read-only-v2
          test "${VITE_TUTOP_TOPI_GUIDED_BETA}" = true
          test "${VITE_TUTOP_TOPI_REMOTE_ENABLED}" = false
          test "${VITE_TUTOP_TOPI_FIREBASE_AI_ENABLED}" = false
          test "${TUTOP_FIREBASE_PROJECT_ID}" = tutop-beta-vicmdlb-1356585881
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          # Exact parent + one-file allowlist: read-only Android compile of the new integration HEAD. No APK upload.
          test "$(git rev-parse HEAD^)" = 'e6ff532c08284dbfe45dd734bd90aa3fe66e1b81'
          changed="$(git diff --name-only HEAD^ HEAD)"
          expected='.github/workflows/tutop-connected-staging-compile.yml'
          test "$changed" = "$expected"
      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install source dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate FCM ownership and workflow read-only contract before credentials
        shell: bash
        run: |
          set -euo pipefail
          node scripts/connected-staging-compile-workflow-tests.mjs
          node --experimental-strip-types scripts/native-push-session-epoch-tests.mjs
      - name: Fetch existing Firebase Web and Android V2 configs READ ONLY
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          TUTOP_FIREBASE_OAUTH_CLIENT_ID: ${{ secrets.FIREBASE_OAUTH_CLIENT_ID }}
          TUTOP_FIREBASE_OAUTH_CLIENT_SECRET: ${{ secrets.FIREBASE_OAUTH_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FIREBASE_TOKEN:-}" || { echo 'BLOCKED: Firebase read-only config credentials not connected'; exit 42; }
          node scripts/prepare-staging-v2-auth.mjs
          node scripts/prepare-staging-android-app.mjs

          # R190: independent GET-only live diagnostics; no mutation permissions,
          # no Auth signups, no App Check certificate registration, no deploy.
          audit_fail=0
          node scripts/audit-staging-auth-client-config.mjs || audit_fail=1
          node scripts/audit-staging-auth-email-config.mjs || audit_fail=1
          # With no expected QA signing fingerprint, this only reads live policy.
          node scripts/audit-staging-offplay-app-check.mjs || audit_fail=1
          npm run v2:rules:prepare >/dev/null || audit_fail=1
          if test -s firebase/firestore.v2.generated.rules; then
            node --input-type=module <<'NODE' || audit_fail=1
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {firebaseCiAccessToken} from './scripts/firebase-ci-auth.mjs';
          const project='tutop-beta-vicmdlb-1356585881';
          if(process.env.GITHUB_REF_NAME!=='integration/tutop-121-122-fcm-owner-ci-20261022' ||
             process.env.TUTOP_FIREBASE_PROJECT_ID!==project ||
             process.env.TUTOP_ALLOW_STAGING_CONFIG_READ!=='read-only-v2')
            throw Error('STAGING_RULES_READ_CONTEXT_REJECTED');
          const accessToken=await firebaseCiAccessToken();
          const get=async url=>{
            const r=await fetch(url,{method:'GET',headers:{
              Authorization:'Bearer '+accessToken,'X-Goog-User-Project':project,
            }});
            if(!r.ok)throw Error('STAGING_RULES_GET_HTTP_'+r.status);
            return await r.json();
          };
          const root='projects/'+project;
          const release=await get('https://firebaserules.googleapis.com/v1/'+root+'/releases/cloud.firestore');
          const name=String(release?.rulesetName||'');
          if(!name.startsWith(root+'/rulesets/'))throw Error('STAGING_RULESET_IDENTITY_MISSING');
          const ruleset=await get('https://firebaserules.googleapis.com/v1/'+name);
          const active=(ruleset?.source?.files||[]).map(f=>f.content||'').join('\n');
          const generated=fs.readFileSync('firebase/firestore.v2.generated.rules','utf8');
          const compact=t=>String(t||'').replace(/\r\n/g,'\n').replace(/\/\/[^\n]*/g,'').replace(/\s+/g,' ').trim();
          const equal=compact(active)===compact(generated);
          const hash=t=>crypto.createHash('sha256').update(String(t)).digest('hex');
          const evidence={
            status:'READ_ONLY',source_sha:process.env.GITHUB_SHA,
            active_ruleset_found:true,active_sha256:hash(active),
            generated_sha256:hash(generated),active_equals_generated:equal,
            active_email_mode:active.includes("email_password_verified_beta"),
            active_email_verified_claim_gate:active.includes("request.auth.token.email_verified == true"),
            mutation:false,spent:0
          };
          console.log(JSON.stringify(evidence));
          // Difference localization only. No live rules content or user data in logs.
          const sections=source=>{
            const matches=[...source.matchAll(/^    match \/([^\n]+) \{/gm)];
            return new Map(matches.map((m,i)=>[
              m[1],compact(source.slice(m.index,i+1<matches.length?matches[i+1].index:source.length))
            ]));
          };
          const liveSections=sections(active), sourceSections=sections(generated);
          const names=[...new Set([...liveSections.keys(),...sourceSections.keys()])].sort();
          const changes=names.filter(n=>liveSections.get(n)!==sourceSections.get(n));
          const privateLive=liveSections.get('user_private/{uid}')||'';
          const privateCandidate=sourceSections.get('user_private/{uid}')||'';
          const statusLive=liveSections.get('auth_status/{uid}')||'';
          const statusCandidate=sourceSections.get('auth_status/{uid}')||'';
          console.log('STAGING_RULES_SCOPED_DIAGNOSTIC '+JSON.stringify({
            active_section_count:liveSections.size,candidate_section_count:sourceSections.size,
            different_section_count:changes.length,different_sections:changes.slice(0,45),
            private_rule_equal:privateLive===privateCandidate,
            auth_status_rule_equal:statusLive===statusCandidate,
            active_private_email_mode:privateLive.includes('email_password_verified_beta'),
            active_private_binds_auth_email:privateLive.includes('request.auth.token.email'),
            active_auth_status_signed_gate:statusLive.includes('request.auth.token.email_verified'),
            mutation:false,scope:'READ_ONLY'
          }));
          // Staging Rules never replace candidate Rules in the source tree for
          // production. Capture a GET-only live snapshot for an isolated
          // synthetic emulator probe, then fail closed before compiling Android.
          if (!equal) {
            const base=process.env.RUNNER_TEMP;
            if (!base || !process.env.GITHUB_ENV) throw Error('STAGING_PROBE_RUNTIME_MISSING');
            fs.writeFileSync(base+'/TuTop-active-staging.rules',active,{mode:0o600});
            fs.appendFileSync(process.env.GITHUB_ENV,'TUTOP_STAGING_RULES_DRIFT=1\n');
            console.log('STAGING_RULES_SOURCE_DEPLOY_DRIFT: offline five-document bootstrap probe scheduled; APK compile BLOCKED');
          }
          if(!evidence.active_email_mode||!evidence.active_email_verified_claim_gate)
            throw Error('STAGING_RULES_VERIFIED_EMAIL_PROOF_MISSING');
          NODE
          else
            audit_fail=1
          fi
          test "$audit_fail" -eq 0
      - name: Diagnose LIVE staging Rules against synthetic five-document email bootstrap (NO staging writes)
        if: ${{ success() }}
        env:
          GCLOUD_PROJECT: demo-tutop-post120-rules
        shell: bash
        run: |
          set -euo pipefail
          if test "${TUTOP_STAGING_RULES_DRIFT:-0}" != 1; then
            echo "STAGING_RULES_EQUAL: active Rules already match generated; no differential probe"
            exit 0
          fi
          # The preceding credential-scoped step retrieved a GET-only ruleset.
          # This step has NO Firebase credentials and runs an isolated demo emulator.
          test -s "$RUNNER_TEMP/TuTop-active-staging.rules"
          test -s firebase/firestore.v2.generated.rules
          # Firebase test packages are intentionally absent from production deps.
          # Install pinned disposable emulator harness dependencies only here;
          # the earlier missing-module failure is a test-harness error, not a Rule denial.
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund \
            firebase@12.18.0 @firebase/rules-unit-testing@5.0.2
          git diff --exit-code -- package.json package-lock.json
          cp firebase/firestore.v2.generated.rules "$RUNNER_TEMP/TuTop-source-generated.rules"
          trap 'cp "$RUNNER_TEMP/TuTop-source-generated.rules" firebase/firestore.v2.generated.rules; rm -f "$RUNNER_TEMP/TuTop-source-generated.rules" "$RUNNER_TEMP/TuTop-active-staging.rules" "$RUNNER_TEMP/TuTop-active-five-doc-probe.log" "$RUNNER_TEMP/TuTop-auth-status-only-preview.rules" "$RUNNER_TEMP/TuTop-auth-status-only-preview.log"' EXIT
          cp "$RUNNER_TEMP/TuTop-active-staging.rules" firebase/firestore.v2.generated.rules
          # Only a synthetic, already-tested five-document onboarding fixture.
          # Never call Firebase Auth, use actual user accounts or deploy Rules.
          set +e
          npx --yes firebase-tools@15.29.0 emulators:exec \
            --only firestore --config firebase.v2.json \
            --project demo-tutop-post120-rules \
            "node --test --test-concurrency=1 --test-name-pattern='post106 permite bootstrap inicial|auth_status binds email_verified' tests/firestore.v2.post106-verified-identity.test.mjs tests/firestore.v2.auth-status.test.mjs" \
            > "$RUNNER_TEMP/TuTop-active-five-doc-probe.log" 2>&1
          probe_rc=$?
          set -e
          # Emit only counts / failed test names; never print live Rules or Auth data.
          grep -E '(^|[[:space:]])(not ok|# tests|# pass|# fail)' "$RUNNER_TEMP/TuTop-active-five-doc-probe.log" | tail -n 12 || true
          # Structured error categories only, no sensitive rule expressions or logs.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const diagnostic=fs.readFileSync(process.env.RUNNER_TEMP+'/TuTop-active-five-doc-probe.log','utf8');
          const flags={
            harness_setup_failure:/not ok 1 - tests\/firestore\.v2\.post106-verified-identity\.test\.mjs/.test(diagnostic),
            permission_denied:/PERMISSION_DENIED/.test(diagnostic),
            wrong_project:/project.{0,20}mismatch|different project id/i.test(diagnostic),
            rules_compile_error:/rules.{0,35}(?:compile|parse|syntax).{0,20}(?:error|failed)|Error parsing function/i.test(diagnostic),
            emulator_unavailable:/ECONNREFUSED|UNAVAILABLE|Failed to connect|emulator did not start/i.test(diagnostic),
            missing_module:/ERR_MODULE_NOT_FOUND|Cannot find package/i.test(diagnostic),
            test_assertion_failure:/AssertionError|FirebaseError/i.test(diagnostic),
          };
          // The authenticated log is never exposed: report only public test
          // source-file line numbers to distinguish expected-deny from
          // unexpected-deny, without leaking active staging Rules.
          const locations=[...new Set([...diagnostic.matchAll(
            /tests\/(firestore\.v2\.(?:auth-status|post106-verified-identity)\.test\.mjs):([0-9]{1,4}):([0-9]{1,4})/g,
          )].map(match=>match[1]+':'+match[2]))].slice(0,8);
          console.log('STAGING_ACTIVE_RULES_TEST_SOURCE_LOCATORS '+JSON.stringify(locations));
          console.log('STAGING_ACTIVE_FIVE_DOC_PROBE_DIAGNOSTIC '+JSON.stringify(flags));
          NODE
          # Diagnose the MINIMAL auth_status section change against the ACTUAL
          # active Rules snapshot. This is in-memory, demo-emulator-only;
          # it never mutates staging, never relaxes the fail-closed compile gate.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const folder=process.env.RUNNER_TEMP;
          if(!folder) throw Error('STAGING_PREVIEW_TEMP_REQUIRED');
          const active=fs.readFileSync(folder+'/TuTop-active-staging.rules','utf8');
          const desired=fs.readFileSync(folder+'/TuTop-source-generated.rules','utf8');
          function section(source){
            const hits=[...source.matchAll(/^    match \/auth_status\/\{uid\} \{/gm)];
            if(hits.length!==1) throw Error('STAGING_AUTH_STATUS_MATCH_NOT_UNIQUE');
            const start=hits[0].index;
            const matcher=/^    match \//gm;
            matcher.lastIndex=start+hits[0][0].length;
            const next=matcher.exec(source);
            if(!next) throw Error('STAGING_AUTH_STATUS_SECTION_END_UNKNOWN');
            return {start,end:next.index};
          }
          // A duplicate or missing section is a security ambiguity, not a
          // reason to guess or overwrite live rules. Log only the counts.
          const count=(src)=>[...src.matchAll(/^    match \/auth_status\/\{uid\} \{/gm)].length;
          console.log('STAGING_AUTH_STATUS_SECTION_COUNTS '+JSON.stringify({
            active:count(active),generated:count(desired)
          }));
          const b=section(desired);
          const replacement=desired.slice(b.start,b.end);
          let preview;
          if(count(active)===0){
            // No canonical auth_status match in LIVE; add only that one scope,
            // anchored before the unique wallets match. Reject aliases/duplicates.
            if(/match\s+\/auth_status\//.test(active))
              throw Error('STAGING_AUTH_STATUS_NONCANONICAL_MATCH_NEEDS_REVIEW');
            const anchors=[...active.matchAll(/^    match \/wallets\/\{uid\} \{/gm)];
            if(anchors.length!==1) throw Error('STAGING_WALLETS_INSERT_ANCHOR_NOT_UNIQUE');
            const at=anchors[0].index;
            preview=active.slice(0,at)+replacement+active.slice(at);
            if(preview.slice(0,at)!==active.slice(0,at)
                ||preview.slice(at+replacement.length)!==active.slice(at))
              throw Error('STAGING_AUTH_STATUS_INSERTION_UNSCOPED_CHANGE');
            console.log('STAGING_AUTH_STATUS_PREVIEW_METHOD_ADD_ONE_SCOPE');
          } else {
            const a=section(active);
            preview=active.slice(0,a.start)+replacement+active.slice(a.end);
            if(preview.slice(0,a.start)!==active.slice(0,a.start)
                ||preview.slice(a.start+replacement.length)!==active.slice(a.end))
              throw Error('STAGING_AUTH_STATUS_REPLACEMENT_UNSCOPED_CHANGE');
            console.log('STAGING_AUTH_STATUS_PREVIEW_METHOD_REPLACE_ONE_SCOPE');
          }
          if(preview===active) throw Error('STAGING_AUTH_STATUS_PREVIEW_NO_DIFFERENCE');
          fs.writeFileSync(folder+'/TuTop-auth-status-only-preview.rules',preview,{mode:0o600});
          console.log('STAGING_AUTH_STATUS_ONLY_PREVIEW_ONE_SECTION_OFFLINE');
          NODE
          cp "$RUNNER_TEMP/TuTop-auth-status-only-preview.rules" firebase/firestore.v2.generated.rules
          set +e
          npx --yes firebase-tools@15.29.0 emulators:exec \
            --only firestore --config firebase.v2.json \
            --project demo-tutop-post120-rules \
            "node --test --test-concurrency=1 --test-name-pattern='post106 permite bootstrap inicial|auth_status binds email_verified' tests/firestore.v2.post106-verified-identity.test.mjs tests/firestore.v2.auth-status.test.mjs" \
            > "$RUNNER_TEMP/TuTop-auth-status-only-preview.log" 2>&1
          preview_rc=$?
          set -e
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw=fs.readFileSync(process.env.RUNNER_TEMP+'/TuTop-auth-status-only-preview.log','utf8');
          function count(k){
            const results=[...raw.matchAll(new RegExp('^# '+k+' ([0-9]+)$','gm'))];
            return results.length?Number(results.at(-1)[1]):null;
          }
          console.log('STAGING_AUTH_STATUS_ONLY_PREVIEW_RESULT '+JSON.stringify({
            tests:count('tests'),pass:count('pass'),fail:count('fail'),
            permission_denied:/PERMISSION_DENIED/.test(raw),
            harness_failure:/ERR_MODULE_NOT_FOUND|ECONNREFUSED/.test(raw)
          }));
          NODE
          if test "$preview_rc" -eq 0; then
            echo 'STAGING_AUTH_STATUS_ONLY_PREVIEW_PASS: offline ONLY, deploy still BLOCKED'
          else
            echo 'STAGING_AUTH_STATUS_ONLY_PREVIEW_INSUFFICIENT: investigate other Rules'
          fi
          cp "$RUNNER_TEMP/TuTop-source-generated.rules" firebase/firestore.v2.generated.rules
          if test "$probe_rc" -eq 0; then
            echo "STAGING_ACTIVE_FIVE_DOC_AND_AUTH_STATUS_SYNTHETIC_PASS: two scoped fixtures"
          else
            echo "::error::STAGING_ACTIVE_FIVE_DOC_BOOTSTRAP_FAIL_OR_EMULATOR_ERROR (no live write)"
          fi
          # Even a passing bootstrap does not establish equality for the other
          # 20 changed Rules sections. Preserve the original fail-closed gate.
          echo "::error::STAGING_RULES_SOURCE_DEPLOY_DRIFT: Android build blocked pending scoped review"
          exit 42
      - name: Export masked Firebase client bundle environment
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const v=JSON.parse(fs.readFileSync('.tutop-staging-web-config.json','utf8'));
          const id='tutop-beta-vicmdlb-1356585881';
          if(v.projectId!==id||!v.apiKey||!v.appId) throw Error('STAGING_WEB_CONFIG_INVALID');
          for(const secret of [v.apiKey,v.appId]) process.stdout.write('::add-mask::'+secret+'\n');
          const rows=[
            ['VITE_FIREBASE_API_KEY',v.apiKey],['VITE_FIREBASE_APP_ID',v.appId],
            ['VITE_FIREBASE_AUTH_DOMAIN',v.authDomain],['VITE_FIREBASE_PROJECT_ID',v.projectId],
            ['VITE_FIREBASE_STORAGE_BUCKET',v.storageBucket],['VITE_TUTOP_APP_VERSION','0.9.2-beta.0'],
          ];
          fs.appendFileSync(process.env.GITHUB_ENV,rows.map(([k,val])=>k+'='+val).join('\n')+'\n');
          NODE
      - name: Build connected Firebase app web code
        run: npm run build
      - name: Install pinned ephemeral Capacitor and sharp
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --no-audit --no-fund --include=optional \
            @capacitor/core@8.5.1 @capacitor/android@8.5.1 \
            @capacitor/geolocation@8.2.2 @capacitor/camera@8.2.4 \
            @capacitor/filesystem@8.1.0 @capacitor-firebase/messaging@8.5.1 \
            @capacitor-firebase/app-check@8.5.0 firebase@12.18.0 \
            @capacitor/cli@8.5.1 @capacitor/assets@3.0.5 sharp@0.34.5
          node -e "const s=require('sharp');if (!s.versions?.sharp) process.exit(3)"
          git diff --exit-code -- package.json package-lock.json
      - name: Generate Firebase-connected Android native project
        run: npm run android:bootstrap
      - name: Pin staging Android beta version before compiling
        shell: bash
        run: |
          set -euo pipefail
          node scripts/configure-android-beta-version.mjs
          grep -q 'versionCode 90200' android/app/build.gradle
          grep -q 'versionName "0.9.2-beta.0"' android/app/build.gradle
      - name: Validate scoped FCM merger rule before Gradle
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<service android:name="com.google.firebase.messaging.FirebaseMessagingService" tools:node="remove" tools:ignore="MissingClass" />' android/app/src/main/AndroidManifest.xml
          echo "FCM merger lint marker is narrowly scoped; merged APK will be audited after Gradle"
      - name: Prove staging package and native Firebase linkage
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/google-services.json
          grep -q 'tutop-beta-vicmdlb-1356585881' android/app/google-services.json
          ! grep -q 'tutop-3a4f7' android/app/google-services.json
          node scripts/verify-android-native-plugin-bundle.mjs
      - name: Compile connected Android debug APK without publishing
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Verify connected APK identity without publishing bytes
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$apk" | grep -q "package: name='mx.tutop.app' versionCode='90200' versionName='0.9.2-beta.0'"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify "$apk"
          # Google/Android's read-only packaging preflight for 16 KiB pages.
          # ZIP alignment alone does not prove native ELF segment alignment or physical QA.
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk" | tail -n 3
          # Verify native ELF PT_LOAD alignment separately from APK ZIP alignment.
          python3 - "$apk" <<'PY'
          import pathlib
          import subprocess
          import sys
          import tempfile
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              libs = [n for n in archive.namelist()
                      if n.startswith('lib/') and n.endswith('.so')]
              for name in libs:
                  with tempfile.TemporaryDirectory() as folder:
                      lib = pathlib.Path(folder) / 'library.so'
                      lib.write_bytes(archive.read(name))
                      result = subprocess.run(['readelf', '-lW', str(lib)],
                                              check=True, capture_output=True, text=True)
                      loads = [line.split() for line in result.stdout.splitlines()
                               if line.strip().startswith('LOAD ')]
                      if not loads:
                          raise SystemExit(f'ELF_LOAD_MISSING: {name}')
                      aligns = [int(columns[-1], 16) for columns in loads]
                      if any(alignment < 16384 for alignment in aligns):
                          raise SystemExit(f'ELF_16K_ALIGNMENT_FAIL: {name}; alignments={aligns}')
              if libs:
                  print(f'ELF_16K_ALIGNMENT_PASS: {len(libs)} shared libraries')
              else:
                  print('ELF_LIBRARIES_ABSENT: no PT_LOAD libraries to audit')
          PY
          # Inspect the final merged APK manifest, not only source AndroidManifest.xml.
          # No install, Firebase write, notification registration or permission grant occurs.
          python3 - "$apk" "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" <<'PY'
          import re
          import subprocess
          import sys

          apk, aapt = sys.argv[1:3]
          def inspect(*args):
              return subprocess.run([aapt, 'dump', *args, apk] if args[0] != 'xmltree'
                                    else [aapt, 'dump', 'xmltree', apk, 'AndroidManifest.xml'],
                                    capture_output=True, text=True, check=True).stdout

          permissions = inspect('permissions')
          declared = set(re.findall(r"uses-permission(?:-sdk-23)?: name='([^']+)'", permissions))
          required = {
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.RECORD_AUDIO',
          }
          forbidden = {
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.ACCESS_BACKGROUND_LOCATION',
              'android.permission.CAMERA',
              'android.permission.READ_EXTERNAL_STORAGE',
              'android.permission.WRITE_EXTERNAL_STORAGE',
              # Children/unknown-age release must not silently inherit ad identifiers.
              'com.google.android.gms.permission.AD_ID',
              'android.permission.ACCESS_ADSERVICES_AD_ID',
              'android.permission.ACCESS_ADSERVICES_ATTRIBUTION',
              'android.permission.ACCESS_ADSERVICES_TOPICS',
          }
          missing = sorted(required - declared)
          prohibited = sorted(forbidden & declared)
          if missing or prohibited:
              raise SystemExit(f'APK_PERMISSION_FAIL missing={missing} forbidden={prohibited}')
          manifest = inspect('xmltree')
          # aapt xmltree shows both value and (Raw: value) on one attribute line.
          # Count android:name attribute nodes, not duplicated textual occurrences.
          lines = manifest.splitlines()
          fcm_events = sum(
              1 for line in lines
              if 'A: android:name' in line and 'com.google.firebase.MESSAGING_EVENT' in line
          )
          handlers = []
          for index, line in enumerate(lines):
              if not re.match(r'^\s*E: service(?:\s|$)', line):
                  continue
              depth = len(line) - len(line.lstrip())
              children = []
              for child in lines[index + 1:]:
                  if not child.strip():
                      continue
                  if len(child) - len(child.lstrip()) <= depth:
                      break
                  children.append(child)
              if not any('com.google.firebase.MESSAGING_EVENT' in child for child in children):
                  continue
              service_attr = next((child for child in children
                                   if 'A: android:name' in child), '')
              class_name = re.search(r'=\s*"([^"]+)"', service_attr)
              handlers.append(class_name.group(1) if class_name else 'unidentified-service')
          print('APK_FCM_MERGED_SERVICE_DIAGNOSTIC: action_occurrences='
                + str(fcm_events) + ' service_count=' + str(len(handlers))
                + ' classes=' + ','.join(handlers))
          # Only the Capacitor handler is authoritative for native callback delivery.
          if handlers != ['io.capawesome.capacitorjs.plugins.firebase.messaging.MessagingService']:
              raise SystemExit('APK_FCM_CAPACITOR_HANDLER_REQUIRED')
          if len(handlers) != 1 or fcm_events != 1:
              raise SystemExit('APK_FCM_SERVICE_NOT_UNIQUE')
          print(f'APK_MANIFEST_PERMISSION_PASS: {len(required)} required, {len(forbidden)} forbidden absent')
          print('APK_FCM_SERVICE_PASS: exactly one MESSAGING_EVENT in merged manifest')
          PY
          # Log a reproducible, non-distributable provenance record.
          # The APK bytes remain ephemeral; only identifiers/hashes are recorded.
          package_identity="$("$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$apk" | grep -m1 '^package:')"
          signer_digest="$("$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | grep -m1 'Signer #1 certificate SHA-256 digest:')"
          cert_sha256="${signer_digest##*: }"
          [[ "$cert_sha256" =~ ^[0-9a-fA-F]{64}$ ]] || { echo 'STOP_INVALID_SIGNER_DIGEST'; exit 2; }
          # Only the fingerprint is transferred to a later GET-only audit, never a keystore.
          printf 'TUTOP_EXPECTED_ANDROID_CERT_SHA256=%s\n' "$cert_sha256" >> "$GITHUB_ENV"
          apk_sha256="$(sha256sum "$apk" | cut -d ' ' -f1)"
          printf 'SOURCE_SHA=%s\n' "$GITHUB_SHA"
          printf 'APK_SHA256=%s\n' "$apk_sha256"
          printf '%s\n' "$package_identity" "$signer_digest"
          {
            echo '### TuTop Android staging — CI evidence only'
            echo "- Source SHA: \`$GITHUB_SHA\`"
            echo "- APK SHA-256 (ephemeral debug): \`$apk_sha256\`"
            echo "- Package and version: \`$package_identity\`"
            echo "- Signing certificate: \`$signer_digest\`"
            echo "- Merged FCM: one Capacitor MessagingService"
            echo "- Native ELF alignment: all present shared libraries >=16 KiB"
            echo "- Scope: NO upload, NO deploy, NO release, NO physical R6"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PASS code and Android Firebase connected compile, NO publish, NO staging mutation, NO physical R6"
      - name: Read back off-Play App Check policy for physical QA, no Firebase writes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          TUTOP_FIREBASE_OAUTH_CLIENT_ID: ${{ secrets.FIREBASE_OAUTH_CLIENT_ID }}
          TUTOP_FIREBASE_OAUTH_CLIENT_SECRET: ${{ secrets.FIREBASE_OAUTH_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          # The APK was compiled only in this ephemeral runner and is not distributed.
          # GET-only audit exposes settings and counts, never certificates or tokens.
          node scripts/audit-staging-offplay-app-check.mjs
          echo "PASS current app signing policy preflight; no APK upload or release"

      - name: Always remove temporary Firebase client configs
        if: always()
        shell: bash
        run: |
          rm -f .tutop-staging-web-config.json .tutop-staging-google-services.json android/app/google-services.json
