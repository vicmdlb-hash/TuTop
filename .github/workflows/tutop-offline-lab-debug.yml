name: TuTop offline LAB APK (no Firebase, no release)

on:
  push:
    branches:
      - integration/tutop-121-122-fcm-owner-ci-20261022
    paths:
      - '.github/workflows/tutop-offline-lab-debug.yml'

permissions:
  contents: read

concurrency:
  group: tutop-one-off-offline-lab-debug
  cancel-in-progress: false

jobs:
  offline-lab-apk:
    if: github.repository == 'vicmdlb-hash/TuTop'
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    env:
      VITE_TUTOP_SCHEMA_V2: 'false'
      VITE_TUTOP_ENVIRONMENT: offline-lab
      VITE_TUTOP_TOPI_REMOTE_ENABLED: 'false'
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
      TUTOP_BETA_VERSION: 0.9.2-lab-source-only
    steps:
      - name: Checkout exact branch without retained credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Verify this one-off workflow modifies no application source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'a18e7828c588a91d7f90a311b4e1e4aa465da5a2'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/tutop-offline-lab-debug.yml'
          test "$VITE_TUTOP_SCHEMA_V2" = false
          test "$VITE_TUTOP_ENVIRONMENT" = offline-lab

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android platform SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Install project locked web dependencies without hooks
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Switch only ephemeral build identity to nonproduction LAB
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const packageId = 'mx.tutop.app.lab';
          const config = JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          const project = JSON.parse(fs.readFileSync('config/project.json','utf8'));
          if (config.appId !== 'mx.tutop.app' || project.applicationId !== 'mx.tutop.app') throw Error('unexpected source identity');
          if (project.productionPublishingAllowed !== false || project.billingAllowed !== false) throw Error('source release/billing policy changed');
          config.appId = packageId;
          project.applicationId = packageId;
          project.applicationIdConfirmed = true;
          fs.writeFileSync('capacitor.config.json',JSON.stringify(config,null,2)+'\n');
          fs.writeFileSync('config/project.json',JSON.stringify(project,null,2)+'\n');
          NODE

      - name: Build offline web resources
        run: npm run build

      - name: Install nonpersistent mobile tools
        run: npm run deps:mobile

      - name: Ensure npm dependency manifests remain unchanged
        run: git diff --exit-code -- package.json package-lock.json

      - name: Generate isolated LAB Android project
        run: npm run android:bootstrap

      - name: Block Firebase staging config and production package ID
        shell: bash
        run: |
          set -euo pipefail
          test ! -f android/app/google-services.json
          test ! -f .tutop-staging-google-services.json
          test ! -f .tutop-staging-web-config.json
          grep -q 'package mx.tutop.app.lab;' android/app/src/main/java/mx/tutop/app/lab/MainActivity.java

      - name: Compile debug Android app
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Verify exact LAB APK package, signature and fingerprint
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          aapt="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          apksigner="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          "$aapt" dump badging "$apk" | tee /tmp/tutop-lab-badging.txt
          grep -q "package: name='mx.tutop.app.lab'" /tmp/tutop-lab-badging.txt
          "$apksigner" verify --verbose "$apk"
          test ! -f android/app/google-services.json
          mkdir -p offline-lab-output
          cp "$apk" offline-lab-output/TuTop_OFFLINE_LAB_DEBUG.apk
          sha256sum offline-lab-output/TuTop_OFFLINE_LAB_DEBUG.apk | tee offline-lab-output/SHA256.txt
          {
            echo "repository=vicmdlb-hash/TuTop"
            echo "purpose=offline_emulator_shell_only_not_production_or_physical_R6"
            echo "source_application_commit=a18e7828c588a91d7f90a311b4e1e4aa465da5a2"
            echo "workflow_commit=${GITHUB_SHA}"
            echo "package_id=mx.tutop.app.lab"
            echo "firebase_config=none"
            echo "google_services=absent"
            echo "signing=default_generated_debug_not_release"
            echo "release_candidate=false"
          } > offline-lab-output/PROVENANCE.txt

      - name: Upload temporary offline LAB archive for private Drive transfer
        uses: actions/upload-artifact@v7
        with:
          name: TuTop_OFFLINE_LAB_DEBUG_ONLY
          path: offline-lab-output/
          if-no-files-found: error
          retention-days: 1
