name: TuTop V2 trusted maintenance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tutop-v2-trusted-maintenance
  cancel-in-progress: false

jobs:
  maintain-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TUTOP_FIREBASE_PROJECT_ID: tutop-beta-vicmdlb-1356585881
      TUTOP_ALLOW_V2_RECONCILE: staging-v2
      TUTOP_ALLOW_V2_MAINTENANCE: staging-v2
      TUTOP_ALLOW_V2_OBSERVABILITY: staging-v2
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require staging credential
        shell: bash
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN no está configurado en GitHub Actions." >&2
            exit 42
          fi

      - name: Expire reservations and repair completed listings
        run: node scripts/reconcile-v2-reservations.mjs --apply

      - name: Verify reservation lock residues fail closed
        run: node scripts/reservation-lock-residue-audit.mjs

      - name: Guard and rebuild trusted reputation purge credentials queue alerts and send push
        run: node scripts/v2-trusted-maintenance-guarded.mjs --apply

      - name: Persist privacy-safe marketplace observability snapshot
        run: node scripts/v2-observability-snapshot.mjs --apply
