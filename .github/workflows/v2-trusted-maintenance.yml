name: TuTop V2 trusted maintenance

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tutop-v2-trusted-maintenance
  cancel-in-progress: false

jobs:
  maintain-staging:
    if: github.ref_name == 'feat/tutop-0.8-p0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TUTOP_FIREBASE_PROJECT_ID: tutop-beta-vicmdlb-1356585881
      TUTOP_ALLOW_V2_RECONCILE: staging-v2
      TUTOP_ALLOW_V2_MAINTENANCE: staging-v2
      TUTOP_ALLOW_V2_OBSERVABILITY: staging-v2
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      TUTOP_FIREBASE_OAUTH_CLIENT_ID: ${{ secrets.FIREBASE_OAUTH_CLIENT_ID }}
      TUTOP_FIREBASE_OAUTH_CLIENT_SECRET: ${{ secrets.FIREBASE_OAUTH_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require same-SHA green October and staging before trusted mutation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/tutop-0.8-p0"
          GATE_RUN_ID="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/october-01-validation.yml/runs" \
            -f branch="$GITHUB_REF_NAME" -f head_sha="$GITHUB_SHA" -f status=success -f event=workflow_dispatch -f per_page=10 \
            --jq '.workflow_runs[0].id // empty')"
          if [ -z "$GATE_RUN_ID" ]; then
            echo "DETENIDO: trusted maintenance requiere october-01-validation exitoso sobre la misma rama y SHA ${GITHUB_REF_NAME}@${GITHUB_SHA}." >&2
            exit 43
          fi
          STAGING_RUN_ID="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/staging-v2-smoke.yml/runs" \
            -f branch="$GITHUB_REF_NAME" -f head_sha="$GITHUB_SHA" -f status=success -f event=workflow_dispatch -f per_page=10 \
            --jq '.workflow_runs[0].id // empty')"
          if [ -z "$STAGING_RUN_ID" ]; then
            echo "DETENIDO: trusted maintenance requiere staging-v2-smoke exitoso sobre la misma rama y SHA ${GITHUB_REF_NAME}@${GITHUB_SHA}." >&2
            exit 44
          fi
          {
            echo "TUTOP_VALIDATED_GATE_RUN_ID=$GATE_RUN_ID"
            echo "TUTOP_VALIDATED_GATE_SHA=$GITHUB_SHA"
            echo "TUTOP_VALIDATED_STAGING_RUN_ID=$STAGING_RUN_ID"
            echo "TUTOP_VALIDATED_STAGING_SHA=$GITHUB_SHA"
          } >> "$GITHUB_ENV"
          echo "✅ Trusted maintenance autorizada para ${GITHUB_REF_NAME}@${GITHUB_SHA}: gate=${GATE_RUN_ID}, staging=${STAGING_RUN_ID}."

      - name: Require managed staging credentials before dependency setup
        shell: bash
        run: |
          set -euo pipefail
          for name in FIREBASE_TOKEN TUTOP_FIREBASE_OAUTH_CLIENT_ID TUTOP_FIREBASE_OAUTH_CLIENT_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "DETENIDO: falta credencial gestionada ${name} en GitHub Actions." >&2
              exit 42
            fi
          done

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expire reservations and repair completed listings
        run: node scripts/gated-trusted-staging-apply.mjs reconcile

      - name: Verify reservation lock residues fail closed
        run: node scripts/reservation-lock-residue-audit.mjs

      - name: Guard and rebuild trusted reputation purge credentials queue alerts and send push
        run: node scripts/gated-trusted-staging-apply.mjs maintenance

      - name: Persist privacy-safe marketplace observability snapshot
        run: node scripts/gated-trusted-staging-apply.mjs observability
