<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050a13" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="TuTop — marketplace universitario de tu facultad" />
    <link rel="icon" type="image/svg+xml" href="/tutop-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>TuTop — Tu producto en el Top</title>
    <script>
      (() => {
        try {
          const value = localStorage.getItem('tutop.theme.v2');
          const preference = value === 'light' || value === 'system' || value === 'dark' ? value : 'dark';
          const resolved = preference === 'system'
            ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : preference;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.style.colorScheme = resolved;
        } catch {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.dataset.themePreference = 'dark';
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
