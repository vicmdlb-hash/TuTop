<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Cuenta · TuTop</title>
  <style>
    :root{color-scheme:dark}body{font:16px/1.6 system-ui;background:#050a13;color:#e5e7eb;max-width:680px;margin:auto;padding:44px 20px}
    .card{background:#0c1422;border:1px solid #233044;border-radius:22px;padding:26px}h1{color:#fff}.muted{color:#94a3b8}
    #status{margin-top:18px;padding:14px;border-radius:12px;background:#111827}#status[data-tone=success]{border:1px solid #22c55e}#status[data-tone=error]{border:1px solid #ef4444}
    label{display:block;margin-top:14px;font-size:13px;font-weight:800}input{box-sizing:border-box;width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px solid #334155;background:#070b12;color:#fff}
    button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:12px;background:#7c3aed;color:#fff;font-weight:900}button:disabled{opacity:.45}
    a{display:inline-block;margin-top:18px;color:#c4b5fd;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <h1 id="action-title">Acción de cuenta TuTop</h1>
    <p id="action-copy" class="muted">Comprobando el enlace seguro de Firebase…</p>
    <div id="status" role="status" aria-live="polite">Comprobando el enlace…</div>

    <form id="reset-form" hidden>
      <label for="new-password">Nueva Clave TuTop</label>
      <input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
      <label for="confirm-password">Confirma la nueva clave</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
      <button id="reset-button" type="submit">Cambiar mi Clave TuTop</button>
    </form>

    <a id="return-link" href="/" hidden>Volver a TuTop</a>
  </main>
  <script type="module" src="/auth-action.js"></script>
</body>
</html>
